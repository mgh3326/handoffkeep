[package]
name = "searchbench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
lindera = { version = "6.2.0", features = ["embed-ko-dic"] }
lindera-tantivy = "6.2.0"
mysql = { version = "28.0.4", default-features = false, features = ["buffer-pool", "minimal-rust", "native-tls"] }
oracle = { version = "0.6.3", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = "0.27.0"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[features]
oracle = ["dep:oracle"]
