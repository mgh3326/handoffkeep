name: handoffkeep
desc: "MySQL schema built from the repository's migrations (internal/store) on MySQL ${MYSQL_VERSION} (SELECT VERSION() in the schema-doc run). handoffkeep_work runs the same code and migrations, so this document covers both."
dsn: my://root@127.0.0.1:3306/handoffkeep
docPath: schema-doc
er:
  format: mermaid

# Relations the code relies on without a foreign key (operator decision 484, hk 6130).
# Declared for the document only; the database is unchanged. A column with a real
# FOREIGN KEY is drawn from the schema and is not listed here.
relations:
  - table: decision_requests
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: jobs
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
