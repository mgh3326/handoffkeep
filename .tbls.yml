name: handoffkeep
desc: "MySQL schema built from the repository's migrations (internal/store) on MySQL ${MYSQL_VERSION} (SELECT VERSION() in the schema-doc run). handoffkeep_work runs the same code and migrations, so this document covers both. In an ER diagram a solid line is a real foreign key in the database. A dashed line is a relation declared in .tbls.yml for a column the code joins on; the database has no foreign key for it (its label says so)."
dsn: my://root@127.0.0.1:3306/handoffkeep
docPath: schema-doc
er:
  format: mermaid

# Relations the code relies on without a foreign key (operator decision 484, hk 6130,
# hk 6131, hk 6125). Declared for the document only; the database is unchanged. A column with a
# real FOREIGN KEY is drawn from the schema and is not listed here. This list is not an
# inventory of every id-like column: it covers the task, job, document and write-op keys
# named in hk 6131 and hk 6125 and leaves external ids (YouTrack issue, project and sync ids,
# delivery ids) and the remaining audit columns undeclared.
relations:
  - table: decision_requests
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: jobs
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "linked to a task when there is one; not enforced by a foreign key"
  - table: mcp_write_audit
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "linked to a task when there is one; not enforced by a foreign key"
  - table: placement_decisions
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "linked to a task when there is one; not enforced by a foreign key"
  - table: sync_decisions
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "mapping derived by trigger from the task's legacy refs.decision_request.id; not decision_requests.id, and no foreign key"
  - table: task_thread_deliveries
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: yt_binding_history
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: yt_binding_intents
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: yt_comment_canary
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: yt_issue_comment_bounds
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: yt_issue_intents
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: yt_task_bindings
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task the row belongs to (no foreign key)"
  - table: yt_link_owned
    columns: [writer_task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task whose link write owns the YouTrack link (no foreign key)"
  - table: yt_link_owned
    columns: [target_task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task at the other end of the owned link (no foreign key)"
  - table: yt_article_bindings
    columns: [document_id]
    parentTable: documents
    parentColumns: [id]
    def: "hk document the YouTrack article mirrors (no foreign key)"
  - table: decision_deliveries
    columns: [request_id]
    parentTable: decision_requests
    parentColumns: [id]
    def: "decision request the notification delivers (joined on d.id = n.request_id; no foreign key)"
  - table: yt_decision_bindings
    columns: [decision_id]
    parentTable: decision_requests
    parentColumns: [id]
    def: "decision request as decimal text (migration_yt_decision_bindings.go; no foreign key)"
  - table: operator_inbox_events
    columns: [previous_request_id]
    parentTable: decision_requests
    parentColumns: [id]
    def: "decision request whose earlier snooze state is recorded for undo; NULL for unrelated events; no foreign key"
  - table: placement_decisions
    columns: [job_id]
    parentTable: jobs
    parentColumns: [job_id]
    parentCardinality: "zero or one"
    def: "job the placement decided for; a refused or failed attempt may precede the claim, so no jobs row may exist yet (no foreign key)"
  - table: decision_requests
    columns: [job_id]
    parentTable: jobs
    parentColumns: [job_id]
    parentCardinality: "zero or one"
    def: "job the request belongs to; an empty job_id means no job (no foreign key)"
  - table: documents
    columns: [job]
    parentTable: jobs
    parentColumns: [job_id]
    parentCardinality: "zero or one"
    def: "job the document was filed for; an empty job means none (no foreign key)"
  - table: yt_task_bindings
    columns: [op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "the issue_create op that published an op_applied binding, NULL otherwise (no foreign key)"
  - table: yt_decision_bindings
    columns: [op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "the op that published an op_applied binding, NULL for an import_verified backfill (no foreign key)"
  - table: yt_article_bindings
    columns: [op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "the op that published the binding, NULL for an import_verified backfill (no foreign key)"
  - table: yt_link_owned
    columns: [intended_op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "op whose plan recorded the link (no foreign key)"
  - table: yt_link_owned
    columns: [released_op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "op that released the link, NULL while it is owned (no foreign key)"
  - table: task_doc_refs
    columns: [task_id]
    parentTable: tasks
    parentColumns: [id]
    def: "task that cites the document (no foreign key; hk 6125)"
  - table: task_doc_refs
    columns: [doc_key]
    parentTable: documents
    parentColumns: [key]
    def: "document the task cites by reference, not the binding (no foreign key; hk 6125)"
  # hk 6233: links the code joins on or keys by a named column, with no foreign key.
  - table: yt_link_plans
    columns: [op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "the write op whose link plan this is (no foreign key)"
  - table: yt_link_steps
    columns: [op_id, attempt]
    parentTable: yt_link_plans
    parentColumns: [op_id, attempt]
    def: "the link plan attempt whose steps these are (no foreign key)"
  - table: yt_write_op_alerts
    columns: [op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "the write op the alert is about (no foreign key)"
  - table: yt_write_op_adoptions
    columns: [op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "the write op another worker adopted (no foreign key)"
  - table: yt_write_op_requeues
    columns: [op_id]
    parentTable: yt_write_ops
    parentColumns: [id]
    def: "the write op that was requeued (no foreign key)"
  - table: lane_looks
    columns: [notice_event_id]
    parentTable: notification_outbox
    parentColumns: [event_id]
    parentCardinality: "zero or one"
    def: "the notice the lane look answers, joined on event_id (no foreign key)"
  - table: bench_grades
    columns: [profile]
    parentTable: bench_catalog
    parentColumns: [profile]
    parentCardinality: "one or more"
    def: "the catalog profile the grade belongs to, joined on profile (no foreign key)"
  - table: tasks
    columns: [project]
    parentTable: youtrack_projects
    parentColumns: [hk_project]
    parentCardinality: "zero or one"
    def: "the YouTrack project mapped to the task's hk project, joined on hk_project (no foreign key)"
  - table: relay_events
    columns: [question]
    parentTable: chat_questions
    parentColumns: [id]
    parentCardinality: "zero or one"
    def: "the chat question the relay event carries; joined in a trigger (no foreign key)"
  - table: deploy_record_projection
    columns: [key, sha256]
    parentTable: documents
    parentColumns: [key, sha256]
    parentCardinality: "zero or one"
    def: "the document the deploy record was read from, joined on key and sha256 (no foreign key)"

# Per-table comments (hk 6233): the hand text for each table. The derived
# usage (which Go file and function reads, writes and deletes it) is appended at
# schema-doc time by scripts/schema-usage; do not write it here.
comments:
  # ---- tasks ----
  - table: tasks
    labels: [source-of-record]
    tableComment: |
      The task record: title, state, priority, project, claim and the job that runs it. Every other tasks-domain table keys to it.
      Retention: none; rows are kept.
  - table: task_comments
    labels: [source-of-record]
    tableComment: |
      Comments on a task, including the ones mirrored from or to YouTrack.
      Retention: none.
  - table: task_events
    labels: [history-log]
    tableComment: |
      Append-only event log of a task: each state change and lifecycle step, read to render the task timeline.
      Retention: none.
  - table: task_orders
    labels: [queue-outbox]
    tableComment: |
      Orders addressed to a task's lane; the lane reads an order, then acknowledges it, and the row stays as the record.
      Retention: none.
  - table: task_origins
    labels: [link-join]
    tableComment: |
      Where a task came from: the YouTrack issue or chat message it was created or synced from.
      Retention: none.
  - table: task_projects
    labels: [link-join]
    tableComment: |
      The project a task belongs to, with the project owner and milestone context read from the project tables.
      Retention: none.
  - table: task_relations
    labels: [link-join]
    tableComment: |
      Typed edges between tasks (for example blocks), written by the hierarchy and spawn code and read by lane checks and wait logic.
      Retention: none.
  - table: task_spawn_notices
    labels: [history-log]
    tableComment: |
      Notices recorded when a spawn request for a task fails or changes state, kept so the owner can see them.
      Retention: none.
  - table: task_spawn_records
    labels: [history-log]
    tableComment: |
      Record of each spawn request made for a task (request, job, outcome), read by the wait and spawn paths.
      Retention: none.
  - table: task_thread_cursors
    labels: [cursor-checkpoint]
    tableComment: |
      Per-thread read position of a task thread, so a lane resumes its thread where it stopped.
      Stands alone by design: a position in task_events (epoch and scan event ids), not a reference to a row that must exist.
      Retention: none.
  - table: task_thread_deliveries
    labels: [queue-outbox]
    tableComment: |
      Thread messages waiting to be delivered to a lane for a task; a row leaves the queue when its delivery is recorded.
      Retention: none.
  - table: task_waits
    labels: [source-of-record]
    tableComment: |
      A wait registered by a task or lane until its condition holds (for example a decision or a blocking task), read by lane checks.
      Retention: none.
  - table: ticket_sets
    labels: [link-join]
    tableComment: |
      A set of tickets sliced from one parent task, written at intake and read when the set is dispatched.
      Retention: none.
  - table: jobs
    labels: [source-of-record]
    tableComment: |
      A job: one panewire session run for a task, with its pane, host, owner and state.
      Retention: none.
  - table: placement_decisions
    labels: [history-log]
    tableComment: |
      Where a job was placed (host and quota pool) and why; read by the console board and the placement path.
      Retention: rows whose decided_at is older than 180 days are deleted by PrunePlacements (placements.go, PlacementRetention = 180 days), 1000 per run.
  - table: lane_looks
    labels: [history-log]
    tableComment: |
      Record of a lane look at its current findings, so an unchanged notice stays silenced until the lane's state changes.
      Retention: none.
  - table: relay_events
    labels: [history-log]
    tableComment: |
      Messages relayed between lanes, kept as the audit of what was sent to whom; read by decision records and task lifecycle.
      Retention: none.
  - table: mcp_write_audit
    labels: [history-log]
    tableComment: |
      Audit row for each write made through the MCP tools: the tool, the task it touched and the outcome.
      Retention: none.
  - table: quota_latest
    labels: [cache-derived]
    tableComment: |
      The latest quota reading per account, window and kind, copied from quota_observations for fast reads by placement.
      Retention: none; rows are replaced as new readings arrive.
  - table: quota_leases
    labels: [lock-lease]
    tableComment: |
      A lease that holds part of an account's quota for one owner and holder while a job uses it; released by ReleaseQuota.
      Stands alone by design: account_key is text and no table holds accounts; quota_latest and quota_presence share the key but have no parent.
      Retention: released by ReleaseQuota (quota.go) when the holder returns the lease; no age rule.
  - table: quota_observations
    labels: [history-log]
    tableComment: |
      Every quota reading taken from an account: the measurement history that quota_latest points into.
      Retention: rows received more than 90 days ago that no quota_latest row points to are deleted by pruneQuotaHistory (quota.go).
  - table: quota_presence
    labels: [cache-derived]
    tableComment: |
      Presence heartbeat per account, written with each presence report and read by placement to see which accounts are live.
      Stands alone by design: account_key is text and no table holds accounts; quota_latest and quota_leases share the key but have no parent.
      Retention: rows whose last_seen is older than 30 days (QuotaPresenceRetention, quota.go) are deleted by putQuotaPresence, per account.
  - table: project_milestones
    labels: [source-of-record]
    tableComment: |
      Milestones of a project, the dates and goals that tasks are planned against.
      Retention: none.
  - table: project_owner_events
    labels: [history-log]
    tableComment: |
      History of project owner changes: who owned a project and when, read by the project overview.
      Retention: none.
  - table: dots_inbox_reads
    labels: [history-log]
    tableComment: |
      One row per dots inbox read: who read the inbox, when and what it listed.
      Stands alone by design: one row per read, keyed by principal text; no other table holds principals.
      Retention: rows older than 30 days (DotsInboxReadRetention) are deleted in the same transaction as each insert (RecordDotsInboxRead, dots_inbox_reads.go).
  - table: dots_results
    labels: [history-log]
    tableComment: |
      Results recorded by a dots run, one row per run outcome, read by the dots views.
      Retention: none.
  - table: dots_run_tokens
    labels: [lock-lease]
    tableComment: |
      Token that identifies one dots run, issued when the run starts and checked when it reports.
      Retention: none.
  - table: memory
    labels: [source-of-record]
    tableComment: |
      Free-text agent memory notes saved by sessions, the store's only copy of them.
      Stands alone by design: agent memory notes keyed by session and agent text; no table holds them.
      Retention: none. No production code path writes it at head; the generic copy path can.
  - table: checkpoints
    labels: [history-log]
    tableComment: |
      Session checkpoints and handoffs saved by sessions (kind, title, body and refs), read by context search.
      Stands alone by design: session checkpoints are keyed by session name, a text value with no table behind it.
      Retention: none. No production code path writes it at head; the generic copy path can. Candidate for retirement, not changed here.
  - table: translations
    labels: [cache-derived]
    tableComment: |
      Stored Korean translations of English text, keyed by source text, so a translated view does not translate again.
      Stands alone by design: keyed by source text and language with the entity kind stored as text: polymorphic, so no single parent.
      Retention: none.
  - table: ledger_cursors
    labels: [cursor-checkpoint]
    tableComment: |
      The position of the ledger reader, so it resumes from the last ledger entry it applied.
      Stands alone by design: one cursor per consumer name; no other table is consumed by name.
      Retention: none.
  - table: bench_catalog
    labels: [config]
    tableComment: |
      The benchmark catalog: the profiles and efforts the benchmark code knows, written from the catalog and read by bench reads.
      Retention: none; upserted on each catalog load.
  - table: bench_grades
    labels: [config]
    tableComment: |
      Grade per benchmark profile, replaced from the catalog on each load.
      Retention: rows for a profile are deleted and re-inserted by upsertBenchCatalog (store.go) when the catalog changes; no age rule.
  - table: bench_reps
    labels: [history-log]
    tableComment: |
      Benchmark repetitions and their outcomes, one row per run, read by bench scoring.
      Stands alone by design: one row per benchmark run; it names its profile and model as text, and no code joins it to bench_catalog.
      Retention: none.
  - table: hk_locks
    labels: [lock-lease]
    tableComment: |
      MySQL advisory-lock rows (one per lock key) that serialise store writes across processes.
      Stands alone by design: lock keys are hashes, not references to rows.
      Retention: none.
  - table: schema_migrations
    labels: [history-log]
    tableComment: |
      The migration ledger: one row per registered migration ID applied to this database, written by the migration runner.
      Stands alone by design: its keys are migration IDs in the code, not rows of another table.
      Retention: none.
  # ---- changes ----
  - table: changes
    labels: [source-of-record]
    tableComment: |
      A change (a pull request) tracked from proposal to merge and deploy, with its head, state and task links.
      Retention: none.
  - table: change_checks
    labels: [cache-derived]
    tableComment: |
      The CI checks of a change's head, mirrored from the forge so state reads need no call out.
      Retention: none; one row per change, head and check; earlier heads' rows are kept (marked gone when a check disappears) and the all-heads view reads them.
  - table: change_check_sets
    labels: [source-of-record]
    tableComment: |
      The observed_at of the newest complete check set applied to each change head: the floor an older check write cannot insert below, so a check a newer complete set excluded never reads as present.
      Retention: none; one row per change and head, moved forward only.
  - table: change_findings
    labels: [history-log]
    tableComment: |
      Review findings on a change, recorded with their severity and disposition.
      Retention: none.
  - table: change_gate_events
    labels: [history-log]
    tableComment: |
      The gate history: one row per gate decision on a change. The change_gate_events_record trigger records a decision when an update changes a change's gate state, head or decision time; the thread rendering reads it.
      Retention: none.
  - table: change_tasks
    labels: [link-join]
    tableComment: |
      The tasks a change delivers, linking each change to its task records.
      Retention: none.
  - table: change_threads
    labels: [source-of-record]
    tableComment: |
      Review threads on a change: the comment thread and its resolution state.
      Retention: none.
  - table: reviews
    labels: [history-log]
    tableComment: |
      Each review recorded against a change: reviewer, head reviewed and verdict.
      Retention: none.
  - table: verifications
    labels: [history-log]
    tableComment: |
      Each verification run against a change head: what was checked and its result.
      Retention: none.
  - table: deploy_record_projection
    labels: [cache-derived]
    tableComment: |
      Projection of deploy records into one row per deploy, rebuilt from the deploy records and read by the deploy views.
      Retention: none.
  - table: deploy_services
    labels: [config]
    tableComment: |
      The services a deploy can target, written from the service registry and read by the deploy paths.
      Stands alone by design: the registry of deployable services, keyed by name; deploy rows name a service as text and no code joins them.
      Retention: none.
  # ---- decisions ----
  - table: decision_requests
    labels: [source-of-record]
    tableComment: |
      A decision request: a question a session asks the operator or a peer to settle, with its options and task.
      Retention: none.
  - table: decision_answer_attempts
    labels: [history-log]
    tableComment: |
      Each attempt to answer a decision request, with its outcome, so a retried answer is recognised.
      Retention: none.
  - table: decision_deliveries
    labels: [queue-outbox]
    tableComment: |
      A decision notice waiting to be delivered to a lane or channel; a row is marked when the delivery is recorded.
      Retention: none.
  - table: decision_notify_digest
    labels: [queue-outbox]
    tableComment: |
      Decision notices waiting for the next digest, sent together and then cleared.
      Stands alone by design: groups notices by day and names no other row.
      Retention: none.
  - table: decision_resolutions
    labels: [source-of-record]
    tableComment: |
      How a decision request was settled: the answer and who settled it.
      Retention: none.
  - table: notification_outbox
    labels: [queue-outbox]
    tableComment: |
      Notifications waiting to be sent to a lane or channel, read by the outbox sender.
      Retention: none.
  - table: operator_inbox_events
    labels: [history-log]
    tableComment: |
      Operator inbox events, each with the previous decision request state kept so an undo can restore it.
      Retention: none.
  - table: operator_inbox_state
    labels: [source-of-record]
    tableComment: |
      The operator's state per inbox item (read, snoozed or done), read by the inbox list.
      Stands alone by design: item_key is 'decision:request:<id>' or 'decision:lane_event:<id>', one of two tables by prefix, so no single parent exists (the code joins decision_requests by that text).
      Retention: none; a row is removed when an undo restores the item.
  - table: chat_messages
    labels: [source-of-record]
    tableComment: |
      Operator chat messages, with their relay state.
      Retention: delivered operator messages older than one year are deleted by pruneChatOnce (chat.go), at most ChatPruneMaxDelete per run.
  - table: chat_questions
    labels: [source-of-record]
    tableComment: |
      Questions raised in chat and their state, linked to decision records.
      Retention: rows older than one year in a terminal state are deleted by pruneChatOnce (chat.go), at most ChatPruneMaxDelete per run.
  - table: chat_message_questions
    labels: [link-join]
    tableComment: |
      Link rows between a chat message and the questions it carries.
      Retention: deleted with their message by pruneChatOnce (chat.go).
  # ---- documents ----
  - table: documents
    labels: [source-of-record]
    tableComment: |
      A document by key: briefs, reports, notes and the other text handoffs keep.
      Retention: a document's body is deleted 30 days after the merge or end of the job it belongs to (DocRetentionDays, doc_retention.go PruneRetention, run every 24 hours by the retention worker in cmd/handoffkeep): review/mwr-* by the reviewer job's merged change and screens/* by the job's end. The merge link (doc_retention_merge.go, hk 6280) also makes review/mwr-*, briefs/mwr-* and screens/mwr-* eligible 30 days after the merge of the one change their review job (mwr-<pr>-<sha7>-...) links to through its task, PR number and reviewed head (the task read from the job's live mwr- documents and the doc_prune_log rows of its deleted ones); apply deletes by it only when DocRetentionMergeLinkApply is on, and the dry run reports it per family either way. reports/mwr-* is never deleted, and a document bound to a YouTrack article is kept.
  - table: doc_prune_log
    labels: [history-log]
    tableComment: |
      Log of the documents a prune deleted: key, sha256, when and who pruned it, plus the deleted document's job and task_id.
      Every pruner writes one row per deleted document in the deleting transaction (doc_prune.go PruneDocuments, doc_retention.go and doc_retention_mysql.go PruneRetention).
      job and task_id (hk 6289) keep the merge link's task evidence after a delete: doc_retention_merge.go counts a review job's tasks over its live mwr- documents and these rows, so a deleted witness still links its job and a deleted second task still makes it ambiguous. Rows written before 20261125-doc-prune-log-evidence have NULL in both and are no evidence.
      Stands alone by design: the log of pruned document keys; the documents it names are gone.
      Retention: none.
  - table: task_doc_refs
    labels: [link-join]
    tableComment: |
      A task citing a document by key, so the citation survives the binding of the document.
      Retention: rows are deleted when their document is pruned (doc_prune.go, doc_retention.go) and by RemoveTaskDocRef.
  - table: attachments
    labels: [source-of-record]
    tableComment: |
      Attachment blobs stored for documents and tasks, with their object location.
      Retention: none by age; an attachment is marked hot-deleted on request (attachment_archive.go, MarkAttachmentHotDeleted), not deleted by a timer.
  - table: attachment_refs
    labels: [link-join]
    tableComment: |
      References from an attachment to the document or task that uses it.
      Retention: rows are deleted when their document is pruned (doc_prune.go, doc_retention.go).
  - table: attachment_uploads
    labels: [queue-outbox]
    tableComment: |
      Uploads in progress, finalised into attachments when the upload completes.
      Stands alone by design: ref_kind and ref_id name the document or task the upload is for, a polymorphic reference, so no single table is its parent.
      Retention: none.
  - table: attachment_usage
    labels: [cache-derived]
    tableComment: |
      Usage counters for attachment storage, recomputed from attachments.
      Stands alone by design: monthly counters keyed by month; nothing points at them.
      Retention: none.
  # ---- youtrack ----
  - table: youtrack_projects
    labels: [config]
    tableComment: |
      The YouTrack projects this store syncs with, and the configuration each one uses.
      Retention: none.
  - table: youtrack_comment_links
    labels: [link-join]
    tableComment: |
      Link between a task comment and the YouTrack comment that mirrors it.
      Retention: none.
  - table: yt_authority
    labels: [config]
    tableComment: |
      Which side is authoritative for each synced field of an entity, read before a sync writes.
      Stands alone by design: kind names the entity type as text: polymorphic, like yt_snapshot_state.
      Retention: none.
  - table: yt_article_bindings
    labels: [link-join]
    tableComment: |
      Binding of a document to a YouTrack article.
      Retention: none.
  - table: yt_binding_cursor
    labels: [cursor-checkpoint]
    tableComment: |
      Position of the binding binder in the binding work, so it resumes where it stopped.
      Stands alone by design: one position for the binding binder; it refers to no row.
      Retention: none.
  - table: yt_binding_history
    labels: [history-log]
    tableComment: |
      History of binding changes: each bind and unbind of a task or entity.
      Retention: none.
  - table: yt_binding_intents
    labels: [queue-outbox]
    tableComment: |
      Intent to bind a task to a YouTrack issue, recorded before the bind is sent and removed when it is applied or dropped.
      Retention: none; removed by DropYTBindingIntent (yt_binding_binder.go).
  - table: yt_comment_canary
    labels: [history-log]
    tableComment: |
      Canary comment per task: a probe comment written to check that comment writes reach YouTrack; removed by removeYTCommentCanaryOnce (yt_comments.go).
      Retention: none beyond that removal.
  - table: yt_comment_write_links
    labels: [link-join]
    tableComment: |
      Link from a task comment write to the YouTrack comment it produced.
      Retention: none.
  - table: yt_decision_bindings
    labels: [link-join]
    tableComment: |
      Binding of a decision request to a YouTrack issue, keyed by the request as decimal text.
      Retention: none.
  - table: yt_entity_map
    labels: [link-join]
    tableComment: |
      Map from a store key to a YouTrack entity id, per tenant; a row is removed when a binding is unbound.
      Retention: none beyond unbind (unbindYTTaskBindingOnce, yt_binding_history.go).
  - table: yt_family_roots
    labels: [link-join]
    tableComment: |
      The root issue of each issue family, so related issues resolve to one root.
      Retention: none.
  - table: yt_issue_comment_bounds
    labels: [cursor-checkpoint]
    tableComment: |
      Per-issue bounds of comment sync: the last comment seen, so sync reads only what is new.
      Retention: none.
  - table: yt_issue_intents
    labels: [queue-outbox]
    tableComment: |
      Intent to create or bind a YouTrack issue for a task, removed when applied or dropped.
      Retention: none beyond removal (dropYTIssueIntentTx, yt_issues.go).
  - table: yt_snapshot_state
    labels: [cache-derived]
    tableComment: |
      Last snapshot of a synced entity as YouTrack returned it, used to tell what changed.
      Stands alone by design: entity_kind and entity_id name a document, an article binding or a task: polymorphic.
      Retention: rows are removed when a binding update is applied or superseded (yt_articles.go).
  - table: yt_task_bindings
    labels: [link-join]
    tableComment: |
      Binding of a task to a YouTrack issue.
      Retention: none beyond unbind (unbindYTTaskBindingOnce, yt_binding_history.go).
  - table: yt_link_owned
    labels: [link-join]
    tableComment: |
      A YouTrack link that this store created and owns, with the task at each end.
      Retention: none; a link is released, not deleted (released_op_id).
  - table: yt_link_plans
    labels: [queue-outbox]
    tableComment: |
      Plan of link operations to run on YouTrack, executed step by step.
      Retention: none.
  - table: yt_link_steps
    labels: [queue-outbox]
    tableComment: |
      The steps of a link plan, each sent and recorded in order.
      Retention: none.
  - table: yt_link_unowned
    labels: [cache-derived]
    tableComment: |
      YouTrack links observed but not owned by this store, recorded so the sweep can read them.
      Stands alone by design: YouTrack link keys are external ids, left undeclared by design (AGENTS.md: external ids).
      Retention: none.
  - table: yt_links_sweep
    labels: [cursor-checkpoint]
    tableComment: |
      The position of the link sweep over YouTrack links.
      Stands alone by design: the sweep cursor over YouTrack links: a position, not a reference to a row.
      Retention: none.
  - table: yt_write_ops
    labels: [queue-outbox]
    tableComment: |
      The write queue to YouTrack: each change to send, with its state and payload, applied by the write worker.
      Retention: none; payloads are redacted in place (yt_payload_redact.go).
  - table: yt_write_op_adoptions
    labels: [history-log]
    tableComment: |
      Record of a write op adopted by another worker, kept for the alert and requeue trail.
      Retention: none.
  - table: yt_write_op_alerts
    labels: [history-log]
    tableComment: |
      Alerts raised for write ops that fail, kept until read by the operator.
      Retention: none.
  - table: yt_write_op_requeues
    labels: [history-log]
    tableComment: |
      Audit row for each requeue of a write op; written by yt_requeue_read_only.go.
      Retention: none.
  - table: sync_log
    labels: [history-log]
    tableComment: |
      Sync log: the ordered change feed that replicas read, one row per change.
      Stands alone by design: one ordered feed; rows are read by position (sync_id), not by a key that points at another table.
      Retention: rows older than the sync retention (HANDOFFKEEP_SYNC_RETENTION, 30 days by default) are deleted by pruneSyncOnce (sync.go), keeping the durable reset boundary.
  - table: sync_state
    labels: [cursor-checkpoint]
    tableComment: |
      The sync position for this store: the last change id written and the reset boundary.
      Stands alone by design: the replica's position in sync_log, a cursor.
      Retention: none.
  - table: sync_decisions
    labels: [cache-derived]
    tableComment: |
      Mirror of decisions for sync, keyed by request id. Its writes come from MySQL triggers (migration_mysql_tasks.go), not from Go code; no Go statement reads it.
      Retention: none.
  - table: yt_feed_cursors
    labels: [cursor-checkpoint]
    tableComment: |
      Cursors into the YouTrack activity feed, one per feed, so each feed read resumes where it stopped.
      Stands alone by design: one cursor per YouTrack feed, a position in sync_log.
      Retention: none.

# Domain viewpoints (dots review hk 6133, P1). Every table is in at least one
# viewpoint; `tables` is the union of its groups and scopes the page's ER diagram.
# The hub tables a domain joins also appear in its "Related outside this domain"
# group, so the edges that leave the domain stay visible without the full diagram.
# Every table belongs to at least one viewpoint; `tbls lint` enforces it when a
# new migration adds a table that no viewpoint lists.
lint:
  requireTableComment:
    enabled: true
  requireViewpoints:
    enabled: true

# Mermaid templates: the default templates with one change. A relation declared in
# relations: above is virtual and drawn dashed (..); a real foreign key is solid (--).
# Copies of output/mermaid/templates from tbls v1.97.0, edited in that one place.
templates:
  mermaid:
    schema: scripts/schema-usage/templates/schema.mermaid.tmpl
    table: scripts/schema-usage/templates/table.mermaid.tmpl

viewpoints:
  - id: tasks
    name: "Tasks, jobs and dots"
    desc: |
      Work items and the fleet that runs them: tasks and their comments, events,
      orders and threads; the jobs placed for them; fleet quota, projects, dots
      runs, bench records and the store's own plumbing.
    tables:
      - tasks
      - task_comments
      - task_events
      - task_orders
      - task_origins
      - task_projects
      - task_relations
      - task_spawn_notices
      - task_spawn_records
      - task_thread_cursors
      - task_thread_deliveries
      - task_waits
      - ticket_sets
      - jobs
      - placement_decisions
      - lane_looks
      - relay_events
      - mcp_write_audit
      - quota_latest
      - quota_leases
      - quota_observations
      - quota_presence
      - project_milestones
      - project_owner_events
      - dots_inbox_reads
      - dots_results
      - dots_run_tokens
      - memory
      - checkpoints
      - translations
      - ledger_cursors
      - bench_catalog
      - bench_grades
      - bench_reps
      - hk_locks
      - schema_migrations
    groups:
      - name: "Tasks"
        desc: "The work items themselves and everything keyed to one task."
        tables:
          - tasks
          - task_comments
          - task_events
          - task_orders
          - task_origins
          - task_projects
          - task_relations
          - task_spawn_notices
          - task_spawn_records
          - task_thread_cursors
          - task_thread_deliveries
          - task_waits
          - ticket_sets
      - name: "Jobs and placement"
        desc: "Sessions placed for tasks: the job, its placement decision, lane looks, relay events and MCP write audit."
        tables:
          - jobs
          - placement_decisions
          - lane_looks
          - relay_events
          - mcp_write_audit
      - name: "Fleet and quota"
        desc: "Hosts, accounts, quota observations and leases, and project ownership and milestones."
        tables:
          - quota_latest
          - quota_leases
          - quota_observations
          - quota_presence
          - project_milestones
          - project_owner_events
      - name: "Dots and memory"
        desc: "Dots run tokens and inbox reads, agent memory, session checkpoints, translations and the ledger cursor."
        tables:
          - dots_inbox_reads
          - dots_results
          - dots_run_tokens
          - memory
          - checkpoints
          - translations
          - ledger_cursors
      - name: "Bench"
        desc: "The benchmark catalog and its grades and reps."
        tables:
          - bench_catalog
          - bench_grades
          - bench_reps
      - name: "Store"
        desc: "The store's own plumbing: advisory locks and the migration ledger."
        tables:
          - hk_locks
          - schema_migrations
  - id: changes
    name: "Changes, review and deploy"
    desc: |
      A change from proposal to production: its checks, findings, gate events and
      threads; the reviews and verifications on it; and the deploy records and
      services the deploy watcher reads.
    tables:
      - changes
      - change_checks
      - change_check_sets
      - change_findings
      - change_gate_events
      - change_tasks
      - change_threads
      - reviews
      - verifications
      - deploy_record_projection
      - deploy_services
      - tasks
    groups:
      - name: "Changes"
        desc: "A change, its checks, findings, gate events, task links and threads."
        tables:
          - changes
          - change_checks
          - change_check_sets
          - change_findings
          - change_gate_events
          - change_tasks
          - change_threads
      - name: "Review"
        desc: "Reviews and verifications recorded against a change."
        tables:
          - reviews
          - verifications
      - name: "Deploy"
        desc: "The deploy records and services the deploy watcher projects."
        tables:
          - deploy_record_projection
          - deploy_services
      - name: "Related outside this domain"
        desc: "Tables one relation away, drawn so the edges that leave this domain stay visible."
        tables:
          - tasks
  - id: decisions
    name: "Decisions and notifications"
    desc: |
      Decisions the fleet asks an operator or a peer to settle, their answers and
      deliveries, the notification outbox, and the operator inbox and chat that
      carry them.
    tables:
      - decision_requests
      - decision_answer_attempts
      - decision_deliveries
      - decision_notify_digest
      - decision_resolutions
      - notification_outbox
      - operator_inbox_events
      - operator_inbox_state
      - chat_messages
      - chat_questions
      - chat_message_questions
      - jobs
      - tasks
      - yt_decision_bindings
    groups:
      - name: "Decision requests"
        desc: "Decision requests, their answer attempts, deliveries, digests and resolutions."
        tables:
          - decision_requests
          - decision_answer_attempts
          - decision_deliveries
          - decision_notify_digest
          - decision_resolutions
      - name: "Notifications"
        desc: "The notification outbox that delivers decision and task notices."
        tables:
          - notification_outbox
      - name: "Operator inbox and chat"
        desc: "The operator inbox state and its undo events, and operator chat messages and questions."
        tables:
          - operator_inbox_events
          - operator_inbox_state
          - chat_messages
          - chat_questions
          - chat_message_questions
      - name: "Related outside this domain"
        desc: "Tables one relation away, drawn so the edges that leave this domain stay visible."
        tables:
          - jobs
          - tasks
          - yt_decision_bindings
  - id: documents
    name: "Documents and attachments"
    desc: |
      Documents by key (briefs, reports, notes) and the attachment blobs and refs
      filed against them, plus the prune log of deleted documents.
    tables:
      - documents
      - doc_prune_log
      - task_doc_refs
      - attachments
      - attachment_refs
      - attachment_uploads
      - attachment_usage
      - jobs
      - tasks
      - yt_article_bindings
    groups:
      - name: "Documents"
        desc: "Documents by key, the tasks that cite one by reference, and the prune log of deleted ones."
        tables:
          - documents
          - doc_prune_log
          - task_doc_refs
      - name: "Attachments"
        desc: "Attachment blobs, the refs filed against them, uploads and usage."
        tables:
          - attachments
          - attachment_refs
          - attachment_uploads
          - attachment_usage
      - name: "Related outside this domain"
        desc: "Tables one relation away, drawn so the edges that leave this domain stay visible."
        tables:
          - jobs
          - tasks
          - yt_article_bindings
  - id: youtrack
    name: "YouTrack sync"
    desc: |
      The YouTrack projection: issue, article and decision bindings, owned and
      unowned links, the write-op queue that sends each change, and the sync log
      and cursors that replay it.
    tables:
      - youtrack_projects
      - youtrack_comment_links
      - yt_authority
      - yt_article_bindings
      - yt_binding_cursor
      - yt_binding_history
      - yt_binding_intents
      - yt_comment_canary
      - yt_comment_write_links
      - yt_decision_bindings
      - yt_entity_map
      - yt_family_roots
      - yt_issue_comment_bounds
      - yt_issue_intents
      - yt_snapshot_state
      - yt_task_bindings
      - yt_link_owned
      - yt_link_plans
      - yt_link_steps
      - yt_link_unowned
      - yt_links_sweep
      - yt_write_ops
      - yt_write_op_adoptions
      - yt_write_op_alerts
      - yt_write_op_requeues
      - sync_log
      - sync_state
      - sync_decisions
      - yt_feed_cursors
      - decision_requests
      - documents
      - tasks
    groups:
      - name: "Bindings"
        desc: "The issue, article and decision bindings the projection keeps, and its cursors and history."
        tables:
          - youtrack_projects
          - youtrack_comment_links
          - yt_authority
          - yt_article_bindings
          - yt_binding_cursor
          - yt_binding_history
          - yt_binding_intents
          - yt_comment_canary
          - yt_comment_write_links
          - yt_decision_bindings
          - yt_entity_map
          - yt_family_roots
          - yt_issue_comment_bounds
          - yt_issue_intents
          - yt_snapshot_state
          - yt_task_bindings
      - name: "Links"
        desc: "Links hk owns on YouTrack, the plans and steps that send them, unowned links and the sweep cursor."
        tables:
          - yt_link_owned
          - yt_link_plans
          - yt_link_steps
          - yt_link_unowned
          - yt_links_sweep
      - name: "Write ops"
        desc: "The write-op queue and the adoption, alert and requeue bookkeeping around it."
        tables:
          - yt_write_ops
          - yt_write_op_adoptions
          - yt_write_op_alerts
          - yt_write_op_requeues
      - name: "Sync"
        desc: "The sync log, its cursor, the decision mirror and the YouTrack feed cursors."
        tables:
          - sync_log
          - sync_state
          - sync_decisions
          - yt_feed_cursors
      - name: "Related outside this domain"
        desc: "Tables one relation away, drawn so the edges that leave this domain stay visible."
        tables:
          - decision_requests
          - documents
          - tasks
