name: CI (any ref)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact ref to test - a 40-hex sha or a branch name (no merge with main)
        required: true
        type: string
      suite:
        description: Which suites to run
        required: false
        type: choice
        default: all
        options:
          - all
          - test
          - vitest
          - build
          - deploy

      packages:
        description: Space-separated Go package patterns (suite=test only)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  resolve:
    name: resolve ref
    runs-on: ubuntu-latest
    # No concurrency group here: keying it on inputs.ref alone lets a
    # same-ref different-suite dispatch cancel a resolve mid-flight and the
    # run dies silently (hk 2199 / comment 8104, one job earlier).
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate packages
        env:
          SUITE: ${{ inputs.suite }}
          PACKAGES: ${{ inputs.packages }}
        run: bash scripts/validate-ci-packages.sh
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          SHA="$(scripts/resolve-ci-ref "$INPUT_REF" "$GITHUB_REPOSITORY")"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  ci:
    name: ci at target ref
    needs: resolve
    # Concurrency is keyed on the RESOLVED sha plus the suite (hk 2199): a
    # dispatch by branch name and one by its sha share a key, and a dispatch on
    # the same sha cancels only the same suite, never a run of a different
    # suite on that sha. The ci and status jobs use DIFFERENT namespaces so a
    # superseded run's status job can never cancel the newer run's ci job.
    concurrency:
      group: ci-any-ref-ci-${{ needs.resolve.outputs.sha }}-${{ inputs.suite }}-${{ inputs.packages }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      suite: ${{ inputs.suite }}
      packages: ${{ inputs.packages }}

  schema-compat:
    name: previous release on target schema
    needs: resolve
    if: ${{ inputs.suite == 'deploy' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      # This job runs code from TARGET_SHA. persist-credentials: false keeps the
      # job token out of .git/config so that code cannot read it. The fetch below
      # and the script need no token: the repo is public.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the target commit
        run: git fetch --no-tags origin "$TARGET_SHA"
      - uses: ./.github/actions/setup-go-cached
      - name: Previous release on the target schema
        run: bash scripts/test-previous-release-schema.sh

  status:
    name: post ci-ok status
    # A completed dispatch posts a COMMIT STATUS named ci-ok on the target sha;
    # PR CI reports a CHECK RUN named ci-ok. For fixed-base drafts the gate reads
    # the commit status on the exact head, which only exists for suite=all —
    # partial suites post ci-ok-<suite> and name their check ci-ok (<suite>).
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, ci, schema-compat]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-any-ref-status-${{ needs.resolve.outputs.sha }}-${{ inputs.suite }}-${{ inputs.packages }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
      CI_RESULT: ${{ needs.ci.result }}
      SCHEMA_COMPAT_RESULT: ${{ needs.schema-compat.result }}
      SUITE: ${{ inputs.suite }}
      PACKAGES: ${{ inputs.packages }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post commit status on target sha
        run: |
          # A cancelled or abandoned run says nothing about the sha: post no
          # status, so the gate reads unknown and holds rather than red
          # (hk 2924, hk 3155).
          RESULT=$CI_RESULT
          if [[ "$CI_RESULT" == success && "$SUITE" == deploy ]]; then
            RESULT=$SCHEMA_COMPAT_RESULT
          fi
          case "$RESULT" in
            success) STATE=success ;;
            cancelled|abandoned) STATE= ;;
            *) STATE=failure ;;
          esac
          if [[ -z "$STATE" ]]; then
            echo "ci was cancelled; no status posted"
            exit 0
          fi
          # Only a full run earns the gate context; partial suites get ci-ok-<suite>.
          if [[ -n "$PACKAGES" ]]; then CONTEXT=ci-ok-test-packages; elif [[ "$SUITE" == all ]]; then CONTEXT=ci-ok; else CONTEXT="ci-ok-$SUITE"; fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$STATE" \
            -f context="$CONTEXT" \
            -f target_url="$RUN_URL" \
            -f description="exact-head CI ($SUITE): $RESULT"
