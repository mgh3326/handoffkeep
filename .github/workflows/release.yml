name: release
# A v* tag builds the four CGO-disabled CLI binaries (linux/darwin x
# amd64/arm64) stamped with the tag, plus SHA256SUMS, and publishes them to the
# tag's GitHub Release with GITHUB_TOKEN. The test tag v0.0.0 (exactly) runs
# the same build and checks on the tag but is never published.
# Manual runs without publish build and verify the same assets for the
# dry-run tag v0.0.0. Pull requests do not run this workflow: ci.yml's
# deploy tier (deploy.yml) already exercises scripts/test-build-release.sh.
# Publication does not rerun the test suite (T-DEPLOY in hk:doc
# decision/2026-11-05/fleet-ci-three-tiers): ci-green waits for ci.yml's
# ci-ok on the tagged commit, and its GATE env is the one-line switch to
# deploy-ok once mergewake reads deploy_checks (decision/2026-11-07 §4-3).
# Hosts pull published assets themselves; this workflow never reaches a host.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets for the selected tag
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate requested publication ref
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTAG'
          import os, re
          if os.environ['REF_TYPE'] != 'tag' or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['REF_NAME']):
              raise SystemExit('publication requires a vMAJOR.MINOR.PATCH tag')
          PYTAG
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Resolve release tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.0.0" >> "$GITHUB_ENV"
          fi
      - name: Check release tag format
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'refusing invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Build release assets
        run: |
          set -euo pipefail
          ./scripts/build-release.sh "$RELEASE_TAG" dist/release
          {
            printf '# Install with node-ops hk-cli-install\n\n'
            printf 'Pass the release tag, the selected os_arch, and its sha256 from SHA256SUMS.\n\n'
            printf 'Download path: https://github.com/%s/releases/download/%s/handoffkeep_<os>_<arch>\n\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '| tag | os_arch | sha256 |\n| --- | --- | --- |\n'
            while read -r digest asset; do
              os_arch=${asset#handoffkeep_}
              printf '| %s | %s | %s |\n' "$RELEASE_TAG" "$os_arch" "$digest"
            done < dist/release/SHA256SUMS
          } > dist/release-notes.md
      - name: Verify release asset metadata and checksums
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version_output=$(dist/release/handoffkeep_linux_amd64 version)
          printf '%s\n' "$version_output"
          [[ "$version_output" == *"release=$RELEASE_TAG"* ]]
          [[ "$version_output" == *"rev=$RELEASE_SHA"* ]]
          [[ $(wc -l < dist/release/SHA256SUMS) -eq 4 ]]
          (cd dist/release && sha256sum -c SHA256SUMS)
      - name: Keep assets for publish
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && github.ref_name != 'v0.0.0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/release/
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  ci-green:
    # Publish only a commit whose main CI passed. The verdict is the ci-ok job
    # of ci.yml's main push run for this SHA; a dispatch or any-ref run of the
    # same SHA cannot override it. The tag is cut right after the merge, so
    # this waits for that run to finish. When a newer main push superseded the
    # run (cancelled, ci-ok skipped), a ci-any-ref ci-ok status decides; with
    # none the commit is not published and the next tag carries its change.
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && github.ref_name != 'v0.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
      statuses: read
    env:
      # The gate this job reads, and the one line that switches it. deploy.yml
      # already publishes deploy-ok on every green deploy tier, but decision
      # §2 and §4-3 keep the gate on ci-ok until mergewake reads deploy_checks:
      # changing the meaning of ci-ok before its readers are ready would let a
      # main-tier-only head through. When it is ready, set GATE to deploy-ok;
      # the script then reads that status alone.
      #
      # While GATE is ci-ok the publication ALSO requires a deploy-ok success
      # (review on #228, high). The main tier no longer runs the release build
      # (hk 3440 moved it to deploy-release), so a green ci-ok alone no longer
      # proves the release assets build and verify. Requiring both keeps the
      # transition honest: nothing publishes without deploy-tier evidence, and
      # the later switch only drops the ci-ok half.
      GATE: ci-ok
    outputs:
      green: ${{ steps.wait.outputs.green }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Longer than ci.yml's slowest job (45 min) plus runner queue and the
          # wait for the run to start; TestReleaseGateOutlastsCI pins it.
          deadline=$(( $(date +%s) + 120*60 ))
          green() { echo "green=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          block() { echo "$1; not publishing" >&2; exit 1; }
          # deploy_ok_state prints the deploy-ok state, or "none"; a failed API
          # call or a response without a statuses array prints "unknown" so the
          # caller retries. The combined status endpoint returns the LATEST
          # state per context, so a rerun's status supersedes the old one and no
          # page can hide it (the plain statuses list is newest-30 only: review
          # on #228, medium).
          #
          # Only a well-formed response with an array .statuses may answer
          # "none" (review on #228, high): a 2xx body of an unexpected shape
          # must not read as "no deploy-ok yet". The jq expression errors on a
          # missing or non-array .statuses, and the caller turns that into
          # "unknown".
          deploy_ok_state() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" -q '
              if (.statuses | type) != "array" then error("no statuses array") else . end
              | [.statuses[] | select(.context == "deploy-ok") | .state] | first // "none"
            ' 2>/dev/null || echo unknown
          }
          # await_deploy_ok blocks until the deploy tier has a verdict on this
          # head. deploy.yml posts it for every completed deploy run.
          await_deploy_ok() {
            while :; do
              state=$(deploy_ok_state)
              case "$state" in
                success) echo "deploy-ok status: success"; return 0 ;;
                failure|error) block "deploy-ok on $GITHUB_SHA is $state" ;;
                pending) echo "deploy-ok status: pending" ;;
                unknown) echo "::warning::reading deploy-ok statuses failed; retrying" ;;
                *) echo "::notice::no deploy-ok status on $GITHUB_SHA yet" ;;
              esac
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "no deploy-ok verdict on $GITHUB_SHA within 120 minutes" >&2; exit 1
              fi
              sleep 30
            done
          }
          # publishable is the only way to publish: it proves the deploy tier
          # on this head and then answers green. While GATE is ci-ok the ci-ok
          # half is established first, then this.
          publishable() { await_deploy_ok; green true; }
          # GATE=deploy-ok: the deploy tier is the only verdict.
          if [ "$GATE" = deploy-ok ]; then
            publishable
          fi
          while :; do
            superseded=no
            # A failed API call is "no verdict yet": the deadline ends the wait.
            if main=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" -q '.workflow_runs | first // {} | "\(.id // 0) \(.status // "none") \(.created_at // "none") \(.conclusion // "")"'); then
              read -r mid ms mt mc <<<"$main"
              echo "ci.yml main push run: $mid $ms $mt $mc"
              if [ "$ms" = completed ]; then
                if job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$mid/jobs?filter=latest&per_page=100" -q '[.jobs[] | select(.name == "ci-ok")] | first // {} | .conclusion // "none"'); then
                  echo "ci-ok job: $job"
                  case "$job" in
                    success) publishable ;;
                    skipped|cancelled|none)
                      case "$mc" in
                        cancelled|skipped) superseded=check ;;
                        *) block "main CI on $GITHUB_SHA ended $mc with ci-ok $job" ;;
                      esac ;;
                    *) block "main CI ci-ok on $GITHUB_SHA ended $job" ;;
                  esac
                  # A cancelled run counts as superseded only when a newer main
                  # push run exists for another commit; a manual or other
                  # cancellation fails closed (review on #151, release.yml:126).
                  if newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=1" -q '.workflow_runs | first // {} | "\(.head_sha // "none") \(.created_at // "none")"'); then
                    read -r nsha nt <<<"$newest"
                    echo "newest ci.yml main push run: $nsha $nt"
                    if [ "$nsha" != "$GITHUB_SHA" ] && [ "$nsha" != none ] && [[ "$nt" > "$mt" ]]; then
                      superseded=yes
                    else
                      block "main CI on $GITHUB_SHA ended $mc with no newer main push"
                    fi
                  else
                    echo "::warning::reading newest main push run failed; retrying"
                  fi
                  if [ "$superseded" = yes ] && status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" -q '[.statuses[] | select(.context == "ci-ok") | .state] | first // "none"'); then
                    echo "main CI superseded; ci-any-ref ci-ok status: $status"
                    case "$status" in
                      success) publishable ;;
                      failure|error) block "ci-any-ref ci-ok status on $GITHUB_SHA is $status" ;;
                      pending) ;;
                      *) echo "::notice::main CI on $GITHUB_SHA was superseded and has no ci-any-ref verdict; not publishing, the next tag carries this change"
                         green false ;;
                    esac
                  else
                    echo "::warning::reading ci-ok statuses failed; retrying"
                  fi
                else
                  echo "::warning::reading main run jobs failed; retrying"
                fi
              fi
            else
              echo "::warning::reading ci.yml main push runs failed; retrying"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "no ci-ok verdict on $GITHUB_SHA within 120 minutes" >&2; exit 1
            fi
            sleep 30
          done

  publish:
    needs: [build, ci-green]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && github.ref_name != 'v0.0.0' && needs.ci-green.outputs.green == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      # The checkouts above use github.sha; refuse if the tag was moved since.
      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag $TAG now points at $tagged, but the assets were built from $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sh scripts/repair-release-assets.sh "$RELEASE_TAG" dist/release
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md
