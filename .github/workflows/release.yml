name: release
# A v* tag builds the four CGO-disabled CLI binaries (linux/darwin x
# amd64/arm64) stamped with the tag, plus SHA256SUMS, and publishes them to the
# tag's GitHub Release with GITHUB_TOKEN. The test tag v0.0.0 (exactly) runs
# the same build and checks on the tag but is never published.
# Manual runs without publish build and verify the same assets for the
# dry-run tag v0.0.0. Pull requests do not run this workflow: ci.yml's
# post-linux job already exercises scripts/test-build-release.sh after merge.
# Publication does not rerun the test suite (T-DEPLOY in hk:doc
# decision/2026-11-05/fleet-ci-three-tiers): ci-green waits for ci.yml's
# ci-ok on the tagged commit. Hosts pull published assets themselves; this
# workflow never reaches a host.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets for the selected tag
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate requested publication ref
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTAG'
          import os, re
          if os.environ['REF_TYPE'] != 'tag' or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['REF_NAME']):
              raise SystemExit('publication requires a vMAJOR.MINOR.PATCH tag')
          PYTAG
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Resolve release tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.0.0" >> "$GITHUB_ENV"
          fi
      - name: Check release tag format
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'refusing invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Build release assets
        run: |
          set -euo pipefail
          ./scripts/build-release.sh "$RELEASE_TAG" dist/release
          {
            printf '# Install with node-ops hk-cli-install\n\n'
            printf 'Pass the release tag, the selected os_arch, and its sha256 from SHA256SUMS.\n\n'
            printf 'Download path: https://github.com/%s/releases/download/%s/handoffkeep_<os>_<arch>\n\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '| tag | os_arch | sha256 |\n| --- | --- | --- |\n'
            while read -r digest asset; do
              os_arch=${asset#handoffkeep_}
              printf '| %s | %s | %s |\n' "$RELEASE_TAG" "$os_arch" "$digest"
            done < dist/release/SHA256SUMS
          } > dist/release-notes.md
      - name: Verify release asset metadata and checksums
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version_output=$(dist/release/handoffkeep_linux_amd64 version)
          printf '%s\n' "$version_output"
          [[ "$version_output" == *"release=$RELEASE_TAG"* ]]
          [[ "$version_output" == *"rev=$RELEASE_SHA"* ]]
          [[ $(wc -l < dist/release/SHA256SUMS) -eq 4 ]]
          (cd dist/release && sha256sum -c SHA256SUMS)
      - name: Keep assets for publish
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && github.ref_name != 'v0.0.0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/release/
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  ci-green:
    # Publish only a commit whose main CI passed. ci.yml reports a ci-ok
    # check run on main pushes; ci-any-ref reports a ci-ok commit status. The
    # tag is cut right after the merge, so this waits for main CI to finish.
    # A commit whose main run was superseded by a newer main push has no
    # verdict: it is not published, and the next tag carries its change.
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && github.ref_name != 'v0.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      checks: read
      statuses: read
    outputs:
      green: ${{ steps.wait.outputs.green }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Longer than ci.yml's slowest job (45 min) plus runner queue and the
          # wait for the run to start; TestReleaseGateOutlastsCI pins it.
          deadline=$(( $(date +%s) + 120*60 ))
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-ok&filter=latest" -q '[.check_runs[] | {status, conclusion}] | first // {} | "\(.status // "none") \(.conclusion // "")"')
            status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" -q '[.[] | select(.context == "ci-ok")] | first | .state // "none"')
            read -r rs rc <<<"$run"
            echo "ci-ok check: $rs $rc; ci-ok status: $status"
            # The main push's latest ci-ok check run decides when it has a
            # verdict: a failure blocks even if an older any-ref status says
            # success. A ci-any-ref status counts only when the check run has
            # no verdict (none yet, or skipped/cancelled because a newer main
            # push superseded it).
            case "$rc" in
              failure|timed_out|action_required|startup_failure)
                echo "main CI ci-ok on $GITHUB_SHA ended $rc; not publishing" >&2; exit 1 ;;
              success)
                echo "green=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            if [ "$rs" = none ] || [ "$rs" = completed ]; then
              case "$status" in
                success) echo "green=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
                failure|error) echo "ci-any-ref ci-ok status on $GITHUB_SHA is $status; not publishing" >&2; exit 1 ;;
              esac
            fi
            if [ "$rs" = completed ]; then
              echo "::notice::main CI on $GITHUB_SHA ended $rc (superseded) and no ci-any-ref verdict; not publishing, the next tag carries this change"
              echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "no ci-ok verdict on $GITHUB_SHA within 120 minutes" >&2; exit 1
            fi
            sleep 30
          done

  publish:
    needs: [build, ci-green]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && github.ref_name != 'v0.0.0' && needs.ci-green.outputs.green == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      # The checkouts above use github.sha; refuse if the tag was moved since.
      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag $TAG now points at $tagged, but the assets were built from $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sh scripts/repair-release-assets.sh "$RELEASE_TAG" dist/release
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md
