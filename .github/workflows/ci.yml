name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run build
        working-directory: web/console
      - run: git diff --exit-code -- internal/ui/static/console
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -timeout 30m ./...
        env:
          HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pin the scanner to the version this config was verified with.
          # [[allowlists]]/targetRules/condition require gitleaks >= 8.25.0;
          # older versions silently drop unknown keys (allowlist = none).
          GITLEAKS_VERSION: "8.30.1"
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o handoffkeep-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/handoffkeep
      - uses: actions/upload-artifact@v4
        with:
          name: handoffkeep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: handoffkeep-*
