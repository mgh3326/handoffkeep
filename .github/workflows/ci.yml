name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact ref (sha) to check out; empty means the event default
        required: false
        default: ''
        type: string
      suite:
        description: Which suites to run (all, test, vitest, build, deploy)
        required: false
        default: all
        type: string
      packages:
        description: Space-separated Go package patterns (suite=test only)
        required: false
        default: ''
        type: string
# Three tiers, the third in deploy.yml (hk:doc
# decision/2026-11-07/fleet-ci-three-tiers-r2, hk 3440).
#   T-PR   pull_request, and every other event too: test, pr-store-db, vitest,
#          build and auto-tag-test. Light: no -race, no macOS, hosted runners
#          only (this repo is public, so PR code never runs on our machines).
#          PostgreSQL runs only in pr-store-db, for every Go package the PR
#          changes whose tests import internal/testdb at the PR head, plus
#          ./internal/store/... when it changes internal/store or
#          internal/testdb: PRs that broke store tests merged and left main
#          red twice in one day (hk 3193), and an internal/mcp change first
#          ran its DB tests on main (hk 3528). The mergewake required checks
#          name these jobs.
#   T-MAIN every event except pull_request: T-PR plus main-linux, which runs the
#          whole Go suite against PostgreSQL WITHOUT -race, the migration and
#          startup smoke, the reopen/quota mutants and bundle freshness. Target
#          is under 10 minutes. ci-ok means this tier is green: mergewake watch
#          and release.yml's ci-green read it. On a main push only, its runner
#          comes from HANDOFFKEEP_POST_LINUX_RUNNER (one runs-on label); every
#          other event, and an unset variable, uses a hosted runner, because a
#          dispatch checks out an arbitrary ref and only reviewed, merged code
#          may reach our machines.
#   T-DEPLOY suite=deploy only, off a pull request: deploy-linux and
#          deploy-macos, the -race suite against PostgreSQL, the -race suite
#          without a database on macOS, and the release-build dry run.
#          deploy.yml runs this tier from a successful main ci run, and on
#          dispatch, plus its schema-compat job (the previous release must
#          still serve on the target schema, hk 3511), and publishes the
#          deploy-ok commit status. A ci-any-ref dispatch runs the same jobs
#          as a diagnostic and publishes no deploy-ok. The deploy tier stays
#          on hosted runners: deploy.yml also runs on dispatch, and its
#          provenance is the caller's event, not a main push.
# A newer push cancels the older run of the same ref, on a pull request and on
# main alike (operator 2026-11-06, reverses hk 3103): the newest main head is
# the one that ships, and its green ci-ok covers the heads it contains. A
# cancelled head reports ci-ok skipped (unknown), never failure; the release
# gate treats it as superseded and releases only the newest green head. When
# the newest head fails, mergewake watch bisects (ci-any-ref) to find and
# revert the breaking merge. Dispatch and workflow_call runs group by run id,
# so they never cancel each other. A workflow_run call is deploy.yml's: it
# groups by run id as well, so neither a main push nor the next deploy can
# cancel a deploy in progress (the deploy tier never cancels).
concurrency: {group: "ci-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name == 'workflow_run') && github.run_id || github.ref }}", cancel-in-progress: true}
permissions:
  contents: read
jobs:
  test:
    if: ${{ contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # T-PR runs without PostgreSQL; DB-backed tests skip here and run in
      # main-linux (internal/testdb).
      HANDOFFKEEP_TEST_NO_DB: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      # The local action comes from the workflow revision, not the ref under
      # test: ci-any-ref and dispatches can name a commit that predates
      # .github/actions/setup-go-cached (hk 3629). Sparse keeps the side
      # tree to the action alone, so repo-wide checks never see it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run build
        working-directory: web/console
      - run: git diff --exit-code -- internal/ui/static/console
      - run: test -z "$(git status --porcelain --untracked-files=all -- internal/ui/static/console)"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go mod tidy -diff
      - name: go test (no race, no PostgreSQL)
        run: go test -timeout 10m ./...
      # Scan only the history reachable from the commit under test (hk 3145).
      # fetch-depth 0 fetches every branch and ref, and off a pull request the
      # action runs `git log --all`, so an old false positive on one branch
      # (5dd7bfa on wk/hk3038 and refs/mergewake/reviews/160) failed the
      # any-ref runs of #156, #158 and #159. Detach, then delete every ref (no-deref
      # so a symref such as origin/HEAD is deleted itself);
      # HEAD alone keeps the target's own history in the scan. A pull request
      # is unchanged: the action scans its commit range.
      - name: drop every ref but HEAD before gitleaks
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git checkout --detach --quiet
          git for-each-ref --format='delete %(refname)' | git update-ref --no-deref --stdin
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Pin the scanner to the version this config was verified with.
          # [[allowlists]]/targetRules/condition require gitleaks >= 8.25.0;
          # older versions silently drop unknown keys (allowlist = none).
          GITLEAKS_VERSION: "8.30.1"
  vitest:
    if: ${{ contains(fromJSON('["all","vitest"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run typecheck
        working-directory: web/console
      - run: npm test
        working-directory: web/console
  build:
    if: ${{ contains(fromJSON('["all","build"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      # The local action comes from the workflow revision, not the ref under
      # test: ci-any-ref and dispatches can name a commit that predates
      # .github/actions/setup-go-cached (hk 3629). Sparse keeps the side
      # tree to the action alone, so repo-wide checks never see it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - name: go build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o handoffkeep-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/handoffkeep
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: handoffkeep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: handoffkeep-*
          retention-days: 7

  auto-tag-test:
    if: ${{ inputs.suite != 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref }}
      - run: python3 scripts/test-auto-tag.py
      - run: python3 scripts/test-repair-release.py
      # hk-follow's gate and rollout decisions against fake APIs (hk 3509).
      - run: bash deploy/hk-follow/test-hk-follow.sh

  pr-store-db:
    # Runs on every event, so it always reports a conclusion and can be a
    # required check. On a pull request it runs PostgreSQL tests for every
    # changed Go package that has DB-backed tests (hk 3528): a package is
    # DB-backed when one of its _test.go files imports internal/testdb at the
    # PR head (internal/testdb's own tests count too), and a changed or
    # removed file belongs to the nearest enclosing directory that holds Go
    # files. A change under internal/store or internal/testdb also tests
    # ./internal/store/... (hk 3193). If the changed files cannot be listed it
    # tests every DB-backed package; if that set cannot be computed (or comes
    # out empty) it tests ./... . Anywhere else it succeeds without testing,
    # because main-linux covers main pushes and dispatches. PostgreSQL is a
    # docker container started only when the decision selects packages
    # (hk 4342): a job-level service would boot for every run, including the
    # ones with nothing to test.
    if: ${{ contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    name: 'pr: store + postgres'
    runs-on: ubuntu-latest
    # ./tests alone takes ~10.5 min on main (run 42617745476); 10m panicked on handoffkeep#286 (hk 3746).
    timeout-minutes: 25
    steps:
      # The event gate runs before the checkout: off a pull request there is
      # nothing to classify, so the job answers in seconds (hk 4342).
      - name: decide scope before checkout
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "event $EVENT: main-linux covers it; not testing"
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: ${{ steps.gate.outputs.run != 'no' }}
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: decide which DB-backed packages to test
        id: decide
        if: ${{ steps.gate.outputs.run != 'no' }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "event $EVENT: main-linux covers it; not testing"
            echo "run=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # go test argument for a package directory; internal/store keeps its
          # ./internal/store/... pattern.
          pkgarg() {
            case "$1" in
              .) echo . ;;
              internal/store|internal/store/*) echo ./internal/store/... ;;
              *) echo "./$1" ;;
            esac
          }
          # Directory of each path; a top-level file is in ".".
          dirs() { sed -e '/^$/d' -e 's|^[^/]*$|./&|' -e 's|/[^/]*$||' | sort -u; }
          # The DB-backed set comes from the shared script (hk 4342); an
          # empty answer means it could not be computed, so fail safe below.
          dbdirs=$(bash scripts/ci-db-dirs.sh || true)
          pkgdirs=""
          if gofiles=$(git ls-files -- '*.go'); then
            pkgdirs=$(dirs <<< "$gofiles")
          fi
          if [ -z "$dbdirs" ] || [ -z "$pkgdirs" ]; then
            echo "cannot compute the DB-backed packages; testing ./... (fail safe)"
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "packages=./..." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selected=""
          if [ -z "$BASE_SHA" ] || ! files=$(git diff -z --name-only --no-renames "$BASE_SHA"...HEAD | tr '\0' '\n'); then
            echo "cannot list the changed files against base '$BASE_SHA'; testing every DB-backed package (fail safe)"
            while IFS= read -r d; do
              selected="$selected$(pkgarg "$d")"$'\n'
            done <<< "$dbdirs"
          else
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                internal/store/*|internal/testdb/*) selected="$selected./internal/store/..."$'\n' ;;
              esac
              # The owning package: the nearest enclosing directory with Go files.
              d=$path
              while [ "$d" != . ]; do
                case "$d" in */*) d=${d%/*} ;; *) d=. ;; esac
                if grep -Fxq -- "$d" <<< "$pkgdirs"; then
                  if grep -Fxq -- "$d" <<< "$dbdirs"; then
                    echo "$path -> $(pkgarg "$d")"
                    selected="$selected$(pkgarg "$d")"$'\n'
                  fi
                  break
                fi
              done
            done <<< "$files"
          fi
          packages=$(printf '%s' "$selected" | sed '/^$/d' | sort -u | tr '\n' ' ' | sed 's/ $//')
          if [ -n "$packages" ]; then
            echo "testing with PostgreSQL: $packages"
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "packages=$packages" >> "$GITHUB_OUTPUT"
          else
            echo "pull request changes no package with DB-backed tests; not testing"
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - name: start PostgreSQL
        if: ${{ steps.decide.outputs.run == 'yes' }}
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=handoffkeep \
            -e POSTGRES_PASSWORD=handoffkeep \
            -e POSTGRES_DB=handoffkeep \
            -p 127.0.0.1:5432:5432 \
            postgres:17
          for i in $(seq 1 60); do
            if docker exec postgres pg_isready -U handoffkeep >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres >&2 || true
          exit 1
      # The local action comes from the workflow revision, not the ref under
      # test: ci-any-ref and dispatches can name a commit that predates
      # .github/actions/setup-go-cached (hk 3629). Sparse keeps the side
      # tree to the action alone, so repo-wide checks never see it.
      - if: ${{ steps.decide.outputs.run == 'yes' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      # CI: PR-tier DB job installs Node for tests/ (unblocks this PR; gap from hk 3528).
      # tests/ holds the vite-built console tests, which need web/console's node_modules.
      - if: ${{ steps.decide.outputs.run == 'yes' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - if: ${{ steps.decide.outputs.run == 'yes' }}
        run: npm ci
        working-directory: web/console
      - if: ${{ steps.decide.outputs.run == 'yes' }}
        uses: ./workflow/.github/actions/setup-go-cached
      - name: go test the selected DB-backed packages (PostgreSQL, no race)
        if: ${{ steps.decide.outputs.run == 'yes' }}
        env:
          HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
          PACKAGES: ${{ steps.decide.outputs.packages }}
        run: |
          read -ra pkgs <<< "$PACKAGES"
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "the decision step said run=yes but selected no packages"
            exit 1
          fi
          go test -timeout 20m -count=1 -v "${pkgs[@]}"

  main-store-1:
    if: ${{ github.event_name != 'pull_request' && contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    name: 'main: store shard 1'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HANDOFFKEEP_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - name: go test store shard 1
        env:
          HANDOFFKEEP_SEARCH_LATENCY: ${{ inputs.packages == './internal/store' && '1' || '' }}
        run: |
          if [ -f scripts/store-test-shard.sh ]; then
            RUN_REGEX=$(bash scripts/store-test-shard.sh 1)
            go test -v -timeout 20m ./internal/store -run "$RUN_REGEX"
          else
            go test -v -timeout 20m ./internal/store
          fi

  main-store-2:
    if: ${{ github.event_name != 'pull_request' && contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    name: 'main: store shard 2'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HANDOFFKEEP_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - name: go test store shard 2
        env:
          HANDOFFKEEP_SEARCH_LATENCY: ${{ inputs.packages == './internal/store' && '1' || '' }}
        run: |
          if [ -f scripts/store-test-shard.sh ]; then
            RUN_REGEX=$(bash scripts/store-test-shard.sh 2)
            go test -v -timeout 20m ./internal/store -run "$RUN_REGEX"
          else
            echo "historical ref without store sharding script; shard 1 ran internal/store"
          fi

  main-packages:
    if: ${{ github.event_name != 'pull_request' && contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    name: 'main: other packages'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HANDOFFKEEP_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run build
        working-directory: web/console
      - run: git diff --exit-code -- internal/ui/static/console
      - run: test -z "$(git status --porcelain --untracked-files=all -- internal/ui/static/console)"
      - name: go test (PostgreSQL, non-store DB packages)
        run: |
          if [ -f scripts/ci-db-non-store.sh ]; then
            pkgs=($(bash scripts/ci-db-non-store.sh))
          else
            marker='^[[:space:]]*(import[[:space:]]+)?([[:alnum:]_.]+[[:space:]]+)?"[^"]*/internal/testdb"'
            dbfiles=$(git grep -l -E "$marker" -- '*_test.go' 2>/dev/null || true)
            dirs=$(printf '%s\n' "$dbfiles" | sed -e '/^$/d' -e 's|^[^/]*$|./&|' -e 's|/[^/]*$||' | sort -u)
            if [ -d internal/testdb ]; then
              dirs=$(printf '%s\ninternal/testdb\n' "$dirs" | sed '/^$/d' | sort -u)
            fi
            pkgs=()
            for d in $dirs; do
              if [ "$d" != "internal/store" ] && [ -d "$d" ]; then
                pkgs+=("./$d")
              fi
            done
          fi
          if [ "${#pkgs[@]}" -gt 0 ]; then
            go test -v -timeout 20m "${pkgs[@]}"
          fi

  main-migration:
    if: ${{ github.event_name != 'pull_request' && contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    name: 'main: migration smoke'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HANDOFFKEEP_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run build
        working-directory: web/console
      - name: Task expected migration and server startup
        env:
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash scripts/test-task-expected-migration.sh

  main-reopen-mutants:
    if: ${{ github.event_name != 'pull_request' && contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    name: 'main: reopen mutants'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HANDOFFKEEP_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - name: Reopen regression mutants
        run: python3 scripts/task-reopen-mutants.py

  main-quota-mutants:
    if: ${{ github.event_name != 'pull_request' && contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    name: 'main: quota mutants'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HANDOFFKEEP_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - name: Quota regression mutants
        run: python3 scripts/quota-mutants.py

  main-release-dryrun:
    if: ${{ github.event_name != 'pull_request' && contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    name: 'main: release build'
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HANDOFFKEEP_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - name: Release build dry run
        run: bash scripts/test-build-release.sh

  deploy-linux:
    # T-DEPLOY (hk 3440): the -race suite against PostgreSQL. It runs on a
    # green main head, from deploy.yml, and on a ci-any-ref dispatch with
    # suite=deploy as a diagnostic. No -race failure may be cancelled: the
    # deploy.yml concurrency group is one per repository and does not cancel.
    # Both runners are hosted: a dispatch can name any sha, and only reviewed,
    # merged code may reach our machines.
    if: ${{ github.event_name != 'pull_request' && inputs.suite == 'deploy' }}
    name: 'deploy: race + postgres'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      # The local action comes from the workflow revision, not the ref under
      # test: ci-any-ref and dispatches can name a commit that predates
      # .github/actions/setup-go-cached (hk 3629). Sparse keeps the side
      # tree to the action alone, so repo-wide checks never see it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run build
        working-directory: web/console
      - run: git diff --exit-code -- internal/ui/static/console
      - run: test -z "$(git status --porcelain --untracked-files=all -- internal/ui/static/console)"
      - name: go test -race
        run: go test -v -race -timeout 30m ./...

  deploy-macos:
    # T-DEPLOY (hk 3440): the CLI ships darwin binaries, so the -race suite
    # also runs on macOS. No service containers there; DB-backed tests skip
    # and already ran in deploy-linux. Hosted only, like deploy-linux.
    if: ${{ github.event_name != 'pull_request' && inputs.suite == 'deploy' }}
    name: 'deploy: macos'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HANDOFFKEEP_TEST_NO_DB: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      # The local action comes from the workflow revision, not the ref under
      # test: ci-any-ref and dispatches can name a commit that predates
      # .github/actions/setup-go-cached (hk 3629). Sparse keeps the side
      # tree to the action alone, so repo-wide checks never see it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run build
        working-directory: web/console
      - run: git diff --exit-code -- internal/ui/static/console
      - run: test -z "$(git status --porcelain --untracked-files=all -- internal/ui/static/console)"
      - name: go test -race (no PostgreSQL)
        run: go test -race -timeout 30m ./...

  deploy-release:
    # T-DEPLOY (hk 3440): the release-build dry run. The tag build and its
    # checksums are what a host installs, so its refusal and stamping checks
    # gate deployment, not the merge.
    if: ${{ github.event_name != 'pull_request' && inputs.suite == 'deploy' }}
    name: 'deploy: release build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      # The local action comes from the workflow revision, not the ref under
      # test: ci-any-ref and dispatches can name a commit that predates
      # .github/actions/setup-go-cached (hk 3629). Sparse keeps the side
      # tree to the action alone, so repo-wide checks never see it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: .github/actions/setup-go-cached
      - uses: ./workflow/.github/actions/setup-go-cached
      - run: bash scripts/test-build-release.sh

  ci-ok:
    # Aggregate check. On a pull request it covers the T-PR jobs; on any other
    # event the T-MAIN jobs. A dispatch with a partial suite emits ci-ok
    # (<suite>) and a suite=deploy dispatch covers only the deploy jobs; a
    # check named exactly 'ci-ok' always means the main tier is green. When
    # the only non-success among the needed jobs is cancelled or abandoned (a
    # newer main head superseded this run, or no runner was acquired), the job
    # is skipped, so mergewake reads unknown and holds instead of seeing a
    # failure (hk 2924). A job that never got a runner reports abandoned in
    # the needs context although the jobs API says cancelled (run
    # 42061203904: a deploy job abandoned, hk 3155).
    name: ${{ inputs.packages != '' && 'ci-ok (test, packages)' || ((inputs.suite || 'all') == 'all' && 'ci-ok' || format('ci-ok ({0})', inputs.suite)) }}
    needs: [test, pr-store-db, vitest, build, auto-tag-test, main-store-1, main-store-2, main-packages, main-migration, main-reopen-mutants, main-quota-mutants, main-release-dryrun, deploy-linux, deploy-macos, deploy-release]
    if: ${{ always() && (contains(needs.*.result, 'failure') || !(contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'abandoned'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite || 'all' }}
          PACKAGES: ${{ inputs.packages }}
          TEST: ${{ needs.test.result }}
          PR_STORE_DB: ${{ needs.pr-store-db.result }}
          VITEST: ${{ needs.vitest.result }}
          BUILD: ${{ needs.build.result }}
          AUTO_TAG: ${{ needs.auto-tag-test.result }}
          MAIN_STORE_1: ${{ needs.main-store-1.result }}
          MAIN_STORE_2: ${{ needs.main-store-2.result }}
          MAIN_PACKAGES: ${{ needs.main-packages.result }}
          MAIN_MIGRATION: ${{ needs.main-migration.result }}
          MAIN_REOPEN_MUTANTS: ${{ needs.main-reopen-mutants.result }}
          MAIN_QUOTA_MUTANTS: ${{ needs.main-quota-mutants.result }}
          MAIN_RELEASE_DRYRUN: ${{ needs.main-release-dryrun.result }}
          DEPLOY_LINUX: ${{ needs.deploy-linux.result }}
          DEPLOY_MACOS: ${{ needs.deploy-macos.result }}
          DEPLOY_RELEASE: ${{ needs.deploy-release.result }}
        # A selected job must succeed; an unselected one must report skipped.
        run: |
          case "$SUITE" in
            all|test|vitest|build|deploy) ;;
            *) echo "unknown suite: $SUITE"; exit 1 ;;
          esac
          post=yes; [ "$EVENT" = pull_request ] && post=no
          deploy=no; [ "$SUITE" = deploy ] && deploy=yes
          in_suite() { case "$SUITE" in all|"$1") echo yes ;; *) echo no ;; esac; }
          bad=0
          require() {
            if [ "$1" = yes ] && [ "$3" != success ]; then echo "$2 did not succeed: $3"; bad=1; fi
            if [ "$1" = no ] && [ "$3" != skipped ]; then echo "$2 ran outside its suite or tier: $3"; bad=1; fi
          }
          # The deploy tier is the only tier a suite=deploy dispatch runs; the
          # main and PR jobs must all report skipped.
          deploywanted=no; [ "$deploy" = yes ] && [ "$post" = yes ] && deploywanted=yes
          require "$deploywanted" deploy-linux "$DEPLOY_LINUX"
          require "$deploywanted" deploy-macos "$DEPLOY_MACOS"
          require "$deploywanted" deploy-release "$DEPLOY_RELEASE"
          main=no; [ "$post" = yes ] && [ "$deploy" = no ] && main=yes
          # auto-tag-test is a light PR/main job; it never runs in the deploy
          # tier, which is exactly the three deploy-* jobs.
          at=yes; [ "$deploy" = yes ] && at=no
          require "$at" auto-tag-test "$AUTO_TAG"
          require "$(in_suite test)" test "$TEST"
          require "$(in_suite test)" pr-store-db "$PR_STORE_DB"
          require "$(in_suite vitest)" vitest "$VITEST"
          require "$(in_suite build)" build "$BUILD"
          main_test=no; [ "$main" = yes ] && main_test=$(in_suite test)
          require "$main_test" main-store-1 "$MAIN_STORE_1"
          require "$main_test" main-store-2 "$MAIN_STORE_2"
          require "$main_test" main-packages "$MAIN_PACKAGES"
          require "$main_test" main-migration "$MAIN_MIGRATION"
          require "$main_test" main-reopen-mutants "$MAIN_REOPEN_MUTANTS"
          require "$main_test" main-quota-mutants "$MAIN_QUOTA_MUTANTS"
          require "$main_test" main-release-dryrun "$MAIN_RELEASE_DRYRUN"
          exit "$bad"
