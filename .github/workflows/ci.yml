name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact ref (sha) to check out; empty means the event default
        required: false
        default: ''
        type: string
      suite:
        description: Which suites to run (all, test, vitest, build)
        required: false
        default: all
        type: string
concurrency: {group: "ci-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.run_id || github.ref }}", cancel-in-progress: true}
permissions:
  contents: read
jobs:
  test:
    if: ${{ contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run build
        working-directory: web/console
      - run: git diff --exit-code -- internal/ui/static/console
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go mod tidy -diff
      - name: Task expected migration and server startup
        run: bash scripts/test-task-expected-migration.sh
      - name: go test -race
        run: go test -v -race -timeout 30m ./...
      - name: Reopen regression mutants
        run: python3 scripts/task-reopen-mutants.py
      - name: Quota regression mutants
        run: python3 scripts/quota-mutants.py
      - run: bash scripts/test-build-release.sh
      - run: python3 scripts/o3gen/test_gen.py
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Pin the scanner to the version this config was verified with.
          # [[allowlists]]/targetRules/condition require gitleaks >= 8.25.0;
          # older versions silently drop unknown keys (allowlist = none).
          GITLEAKS_VERSION: "8.30.1"
  vitest:
    if: ${{ contains(fromJSON('["all","vitest"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: web/console/.nvmrc, cache: npm, cache-dependency-path: web/console/package-lock.json}
      - run: npm ci
        working-directory: web/console
      - run: npm run typecheck
        working-directory: web/console
      - run: npm test
        working-directory: web/console
  build:
    if: ${{ contains(fromJSON('["all","build"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with: {go-version-file: go.mod}
      - name: go build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o handoffkeep-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/handoffkeep
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: handoffkeep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: handoffkeep-*
          retention-days: 7
