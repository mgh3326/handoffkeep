name: deploy
# The deploy tier (hk:doc decision/2026-11-07/fleet-ci-three-tiers-r2, hk
# 3440). It runs ci.yml's heavy jobs on a head whose main tier is already
# green, plus the previous-release schema check (schema-compat, hk 3511): the
# target migrates a fresh database and the previous release must still serve.
# It publishes the commit status deploy-ok on that head. ci-ok still means
# "the main tier is green"; deploy-ok means "the deploy tier is green" and is
# what rollout admission will read once mergewake reads deploy_checks. Until
# then release.yml's ci-green keeps reading ci-ok (decision §4-3).
#
# Triggers:
#   workflow_run  a ci.yml run completed. Only a successful main push run
#                 deploys: a pull request is not a candidate, and a cancelled
#                 or failed run has no verdict (its head reads unknown, never
#                 green). The target is that run's head sha.
#   workflow_dispatch  the sha input, or the dispatched ref's head when empty.
#                 This is how a human re-runs the tier on an old head, and how
#                 the PR that introduced this file was measured. The base
#                 input picks the previous release for schema-compat; empty
#                 means the newest v* tag before the target.
#
# Concurrency is one group per repository and never cancels: a race failure on
# a head must not disappear because a newer head arrived, and a cancelled head
# would read unknown. Only the newest pending run is kept, so a burst of main
# pushes deploys the newest head and drops the rest from the queue.
on:
  workflow_run:
    # ci.yml is by name, the only workflow it may follow. branches: [main] drops
    # every pull request and any-ref call at the trigger, before a run exists;
    # the target job repeats the main-push test so a manually edited trigger
    # cannot deploy a PR head.
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to run the deploy tier on; empty means the dispatched ref head'
        required: false
        default: ''
        type: string
      base:
        description: 'Previous release to check the schema against (commit or tag); empty means the newest v* tag before the target'
        required: false
        default: ''
        type: string
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  statuses: write
jobs:
  target:
    # Decide whether this event deploys at all and name the commit. A ci.yml
    # workflow_run deploys only when that run succeeded on a main push; a
    # cancelled run, a pull request and any other conclusion are skipped here,
    # so the tier never runs and no status is posted.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the target sha
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            workflow_run)
              SHA="$RUN_SHA"
              ;;
            workflow_dispatch)
              SHA="${INPUT_SHA:-$HEAD_SHA}"
              ;;
            *)
              echo "unsupported event: $EVENT" >&2
              exit 1
              ;;
          esac
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target is not a 40-hex commit sha: '$SHA'" >&2
            exit 1
          fi
          echo "deploy target: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  ci:
    # ci.yml's suite=deploy, run on the target sha. The permissions are
    # exactly what ci.yml declares, so the call validates.
    needs: target
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
      suite: deploy

  schema-compat:
    # The previous release must keep serving on the schema the target
    # migrates. With blue-green the new colour migrates the shared database
    # while the old colour still answers requests, so a migration that is not
    # expand-only breaks a live deploy. scripts/test-previous-release-schema.sh
    # migrates a fresh database with the target binary, then runs the previous
    # release's server on it and exercises a smoke set (healthz, task
    # list/show/create, comment create and list, decision list). The previous
    # release is the newest v* tag before the target, or the dispatch's base
    # input. This job is part of the deploy tier: a failure fails deploy-ok.
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Pin the revision that defines this workflow, not whatever the event
          # carried: a dispatch (or a re-run) can name an old ref that predates
          # this script, and the job must still run. workflow_sha is the commit
          # of the workflow file. Full history and every tag so the target and
          # the previous release resolve; the script builds both from their
          # commits, never the working tree.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with: {go-version-file: go.mod}
      - name: Previous release on the target schema
        env:
          # The target commit to build; the checkout is only the workflow
          # revision. Only a dispatch can name a base; empty means the newest
          # v* tag before the target.
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          BASE: ${{ inputs.base }}
        run: |
          if [[ -n "$BASE" ]]; then
            bash scripts/test-previous-release-schema.sh "$BASE"
          else
            bash scripts/test-previous-release-schema.sh
          fi

  status:
    # deploy-ok on the target sha. A cancelled or abandoned tier says nothing
    # about the commit, so it posts no status and the head reads unknown
    # (hk 2924). This is the only writer of the deploy-ok context anywhere in
    # the repository: ci-any-ref's suite=deploy is a diagnostic and posts
    # ci-ok-deploy instead.
    needs: [target, ci, schema-compat]
    if: ${{ always() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.target.outputs.sha }}
      RESULT: ${{ needs.ci.result }}
      SCHEMA_COMPAT: ${{ needs.schema-compat.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVIDENCE: ${{ github.repository }}@${{ needs.target.outputs.sha }}
    steps:
      - name: Post deploy-ok on the target sha
        run: |
          verdict() {
            case "$1" in
              success)             echo success ;;
              cancelled|abandoned) echo unknown ;;
              *)                   echo failure ;;
            esac
          }
          # Both jobs are the tier: any failure fails deploy-ok; with no
          # failure, a cancelled or abandoned job leaves the head unknown; only
          # two successes report green (hk 3511, hk 2924).
          a=$(verdict "$RESULT")
          b=$(verdict "$SCHEMA_COMPAT")
          if [[ "$a" == failure || "$b" == failure ]]; then
            STATE=failure
          elif [[ "$a" == unknown || "$b" == unknown ]]; then
            STATE=
          else
            STATE=success
          fi
          if [[ -z "$STATE" ]]; then
            echo "deploy tier was cancelled; no deploy-ok status posted"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$STATE" \
            -f context=deploy-ok \
            -f target_url="$RUN_URL" \
            -f description="deploy tier (race + postgres, macOS, release build, previous-release schema): $RESULT schema=$SCHEMA_COMPAT on $EVIDENCE"
