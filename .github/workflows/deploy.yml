name: deploy
# The deploy tier (hk:doc decision/2026-11-07/fleet-ci-three-tiers-r2, hk
# 3440). It runs ci.yml's heavy jobs on a head whose main tier is already
# green, plus the previous-release schema check (schema-compat, hk 3511): the
# target migrates a fresh database and the previous release must still serve.
# It publishes the commit status deploy-ok on that head. ci-ok still means
# "the main tier is green"; deploy-ok means "the deploy tier is green" and is
# what rollout admission will read once mergewake reads deploy_checks. Until
# then release.yml's ci-green keeps reading ci-ok (decision §4-3).
#
# Triggers:
#   push  a push to main (hk 6156). The deploy tier starts with the main-push
#         run instead of after it, so the two tiers run side by side on one
#         head and merge-to-production is one tier long, not two. The target is
#         the pushed sha. deploy-ok says only that this tier is green: a head
#         moves only when its ci-ok is green as well, because hk-follow's gate
#         (I1) and release.yml's ci-green both require ci-ok and deploy-ok on
#         the sha. The promote job waits, bounded, for the main tier to finish
#         before it reads that gate, so a verdict still pending cannot hold a
#         release that would pass.
#   workflow_dispatch  the sha input, or the dispatched ref's head when empty.
#                 This is how a human re-runs the tier on an old head, and how
#                 the PR that introduced this file was measured. The base
#                 input picks the previous release for schema-compat; empty
#                 means the newest v* tag before the target.
#
# Concurrency is one group per repository and never cancels: a race failure on
# a head must not disappear because a newer head arrived, and a cancelled head
# would read unknown. Only the newest pending run is kept, so a burst of main
# pushes deploys the newest head and drops the rest from the queue (a dropped
# head is cancelled while pending and reads unknown, never green). A push
# starts a deploy even when its main tier later fails; that head then has a
# deploy-ok success and no ci-ok success, and the gate refuses it.
on:
  push:
    # branches: [main] drops every pull request and any other branch at the
    # trigger; the target job repeats the main-push test so an edited trigger
    # cannot deploy a PR head.
    branches: [main]
  workflow_run:
    # A rerun of a main push's ci run that turns green (hk 6156 review). The
    # push above already handles the first attempt; a rerun fires no push, so
    # without this a head whose promote was held on a failed or pending ci-ok
    # would stay unpromoted. The target job accepts only a successful rerun
    # (run_attempt > 1) of a main push, so a normal push deploys once.
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to run the deploy tier on; empty means the dispatched ref head'
        required: false
        default: ''
        type: string
      base:
        description: 'Previous release to check the schema against (commit or tag); empty means the newest v* tag before the target'
        required: false
        default: ''
        type: string
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  statuses: write
jobs:
  target:
    # Decide whether this event deploys at all and name the commit. A push
    # deploys only when it lands on main; any other ref is skipped here, so the
    # tier never runs and no status is posted.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt > 1) }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the target sha
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            push)
              SHA="$HEAD_SHA"
              ;;
            workflow_run)
              SHA="$RUN_SHA"
              ;;
            workflow_dispatch)
              SHA="${INPUT_SHA:-$HEAD_SHA}"
              ;;
            *)
              echo "unsupported event: $EVENT" >&2
              exit 1
              ;;
          esac
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target is not a 40-hex commit sha: '$SHA'" >&2
            exit 1
          fi
          echo "deploy target: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  ci:
    # ci.yml's suite=deploy, run on the target sha. The permissions are
    # exactly what ci.yml declares, so the call validates.
    needs: target
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
      suite: deploy

  schema-compat:
    # The previous release must keep serving on the schema the target
    # migrates. With blue-green the new colour migrates the shared database
    # while the old colour still answers requests, so a migration that is not
    # expand-only breaks a live deploy. scripts/test-previous-release-schema.sh
    # migrates a fresh database with the target binary, then runs the previous
    # release's server on it and exercises a smoke set (healthz, task
    # list/show/create, comment create and list, decision list). The previous
    # release is the newest v* tag before the target, or the dispatch's base
    # input. This job is part of the deploy tier: a failure fails deploy-ok.
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: handoffkeep
          POSTGRES_PASSWORD: handoffkeep
          POSTGRES_DB: handoffkeep
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoffkeep" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HANDOFFKEEP_TEST_DB_URL: postgres://handoffkeep:handoffkeep@localhost:5432/handoffkeep?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Pin the revision that defines this workflow, not whatever the event
          # carried: a dispatch (or a re-run) can name an old ref that predates
          # this script, and the job must still run. workflow_sha is the commit
          # of the workflow file. Full history and every tag so the target and
          # the previous release resolve; the script builds both from their
          # commits, never the working tree.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Fetch the requested commits
        env:
          # A dispatch may name a head no branch or tag points at any more (a
          # deleted branch, a force-pushed-away commit): fetch-depth 0 covers
          # refs/heads/* and refs/tags/*, not an arbitrary commit. ci.yml
          # checks the same target out by name, so fetch it here too rather
          # than fail on an absent object.
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          BASE: ${{ inputs.base }}
        run: |
          git fetch --no-tags origin "$TARGET_SHA"
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "$BASE"
          fi
      - uses: ./.github/actions/setup-go-cached
      - name: Previous release on the target schema
        env:
          # The target commit to build; the checkout is only the workflow
          # revision. Only a dispatch can name a base; empty means the newest
          # v* tag before the target.
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          BASE: ${{ inputs.base }}
        run: |
          if [[ -n "$BASE" ]]; then
            bash scripts/test-previous-release-schema.sh "$BASE"
          else
            bash scripts/test-previous-release-schema.sh
          fi

  status:
    # deploy-ok on the target sha. A cancelled or abandoned tier says nothing
    # about the commit, so it posts no status and the head reads unknown
    # (hk 2924). This is the only writer of the deploy-ok context anywhere in
    # the repository: ci-any-ref's suite=deploy is a diagnostic and posts
    # ci-ok-deploy instead.
    needs: [target, ci, schema-compat]
    if: ${{ always() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.target.outputs.sha }}
      RESULT: ${{ needs.ci.result }}
      SCHEMA_COMPAT: ${{ needs.schema-compat.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post deploy-ok on the target sha
        run: |
          verdict() {
            case "$1" in
              success)             echo success ;;
              cancelled|abandoned) echo unknown ;;
              *)                   echo failure ;;
            esac
          }
          # Both jobs are the tier: any failure fails deploy-ok; with no
          # failure, a cancelled or abandoned job leaves the head unknown; only
          # two successes report green (hk 3511, hk 2924).
          a=$(verdict "$RESULT")
          b=$(verdict "$SCHEMA_COMPAT")
          if [[ "$a" == failure || "$b" == failure ]]; then
            STATE=failure
          elif [[ "$a" == unknown || "$b" == unknown ]]; then
            STATE=
          else
            STATE=success
          fi
          if [[ -z "$STATE" ]]; then
            echo "deploy tier was cancelled; no deploy-ok status posted"
            exit 0
          fi
          # GitHub refuses a status description over 140 characters (422), and
          # a refused status is no deploy-ok at all: the text is short by
          # construction and truncated here as the bound. The run link is in
          # target_url.
          desc="deploy tier: ci=$RESULT schema-compat=$SCHEMA_COMPAT"
          desc=${desc:0:140}
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$STATE" \
            -f context=deploy-ok \
            -f target_url="$RUN_URL" \
            -f description="$desc"

  promote:
    # Push deploy (hk 3509, hk:doc decision/2026-11-08/hk-push-rollout-shiftgate
    # r3). After a green deploy tier, move the image tag `deploy` to the
    # target's image; hk-follow on ncp rolls out whatever that tag names after
    # re-checking the same gate itself. This job only moves a registry tag: it
    # holds no server credential and reaches no host.
    #
    # Since hk 6156 the main tier (ci.yml's ci-ok) runs beside this tier, not
    # before it. The first step waits, bounded, for ci.yml's push run on the
    # target to complete; the gate then reads a final ci-ok. A timeout falls
    # through to the gate, which holds the promote as it always did.
    #
    # The gate is deploy/hk-follow/hk-follow's, shared with hk-follow (I1, I2):
    # ci-ok and deploy-ok success on the sha, the sha on main and newer than
    # the sha the tag names now, and an approval record
    # (deploy-approval/handoffkeep/<sha> in hk) when a migration landed since
    # then. A hold posts deploy-promote=pending and leaves the tag; re-run
    # this workflow on the sha after writing the approval. The job runs only
    # when both tier jobs passed and deploy-ok was posted; it re-reads every
    # verdict from GitHub rather than from these results.
    needs: [target, ci, schema-compat, status]
    if: ${{ needs.ci.result == 'success' && needs.schema-compat.result == 'success' && needs.status.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      statuses: write
      packages: write
    env:
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The workflow revision, not the target: a dispatch on an old sha
          # must still run this revision's gate. (Quoted only so this line
          # differs from schema-compat's identical checkout ref.)
          ref: '${{ github.workflow_sha }}'
          persist-credentials: false
      - name: Wait for the main tier on the target
        # ci.yml's push run on the same sha reports ci-ok, which the gate needs
        # as a final verdict. Poll for it to complete, bounded at 30 minutes; a
        # missing run or a timeout leaves the decision to the gate, which holds
        # the promote rather than guessing.
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.target.outputs.sha }}
        run: |
          for _ in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&event=push&branch=main&per_page=1" -q '.workflow_runs | first // {} | .status // "none"') || state=unknown
            case "$state" in
              completed | none) break ;;
            esac
            sleep 30
          done
          echo "main tier on $TARGET_SHA: $state"
      - uses: ./.github/actions/setup-go-cached
      - name: Build the hk CLI for the approval read
        run: go build -trimpath -o "$RUNNER_TEMP/handoffkeep" ./cmd/handoffkeep
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the target to the deploy tag
        env:
          GH_TOKEN: ${{ github.token }}
          HK_FOLLOW_REPO: ${{ github.repository }}
          HK_FOLLOW_IMAGE: ghcr.io/${{ github.repository }}
          # hk is read only for the approval record. Without these secrets a
          # migration reads as unapproved-unreadable and the promote fails
          # closed; a release with no migration never calls hk.
          HANDOFFKEEP_URL: ${{ secrets.HK_PROMOTE_URL }}
          HANDOFFKEEP_TOKEN: ${{ secrets.HK_PROMOTE_TOKEN }}
          HANDOFFKEEP_CF_ACCESS_CLIENT_ID: ${{ secrets.HK_PROMOTE_CF_ACCESS_CLIENT_ID }}
          HANDOFFKEEP_CF_ACCESS_CLIENT_SECRET: ${{ secrets.HK_PROMOTE_CF_ACCESS_CLIENT_SECRET }}
          # The store mode must match the one ncp's tick uses (hk 5425). Set the
          # repository variable HK_FOLLOW_STORE to mysql at the cutover, with the
          # env file on ncp; unset means postgres.
          HK_FOLLOW_STORE: ${{ vars.HK_FOLLOW_STORE || 'postgres' }}
        run: |
          export HANDOFFKEEP_CLI="$RUNNER_TEMP/handoffkeep"
          bash deploy/hk-follow/hk-follow promote "$TARGET_SHA"
