name: image
# Builds the handoffkeep container image. Pull requests and manual runs build
# (and smoke-test) only; pushes to main additionally push to GHCR with tags
# <full commit sha> and `main`. No deploy step lives here — the NCP systemd
# deployment is unchanged by this pipeline.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # .git must reach the Docker build context so go build can stamp
      # vcs.revision; checkout already provides it (.dockerignore must not
      # exclude it — see tests/image_pipeline_test.go).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 image (load)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: handoffkeep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify vcs stamp matches the built commit
        run: ./scripts/verify-image-vcs.sh handoffkeep:ci ${{ github.sha }}
      - name: Smoke test image
        run: |
          set -eu
          user=$(docker image inspect handoffkeep:ci --format '{{.Config.User}}')
          [ "$user" = "nonroot" ] || [ "$user" = "65532" ] || {
            echo "image runs as unexpected user: '$user'" >&2; exit 1; }
          help_out=$(timeout 60 docker run --rm handoffkeep:ci serve -h 2>&1 || true)
          echo "$help_out"
          echo "$help_out" | grep -q 'Usage of serve'
          serve_out=$(timeout 60 docker run --rm handoffkeep:ci serve 2>&1 || true)
          echo "$serve_out"
          echo "$serve_out" | grep -q 'HANDOFFKEEP_DB_URL and HANDOFFKEEP_AUTH_FILE are required'
      - name: Build and push multi-arch image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
