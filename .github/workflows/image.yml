name: image
# Builds the handoffkeep container image after merge (T-POST): main pushes
# build, smoke-test and push to GHCR; manual runs build and smoke-test only.
# Pull requests do not run it (mergewake watches image on main). Tags
# <full commit sha> and `main`. No deploy step lives here — the NCP systemd
# deployment is unchanged by this pipeline.
on:
  push:
    branches: [main]
  workflow_dispatch:
# A newer main push cancels the older image run, the same rule as ci.yml
# (fleet policy policy/fleet-ci-main-cancel): the newest main head's image is
# the one that ships and carries the `main` tag; a cancelled head's image check
# reads unknown, never failure. Manual runs group by run id and never cancel.
concurrency: {group: "image-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}", cancel-in-progress: true}
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Buildx layer cache lives in GHCR, not the Actions cache: the repo's 10 GB
  # Actions cache limit evicted toolchain caches when gha layers filled it.
  IMAGE_CACHE: ghcr.io/${{ github.repository }}:buildcache
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # .git must reach the Docker build context so go build can stamp
      # vcs.revision; checkout already provides it (.dockerignore must not
      # exclude it — see tests/image_pipeline_test.go).
      # persist-credentials: false keeps the job token out of .git/config:
      # the build stage copies .git into a layer, and the registry cache
      # (mode=max) exports intermediate layers to a tag anyone can pull.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      # Runs on manual dispatch too, so a dispatched build can read the
      # registry cache. Only main pushes write it.
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 image (load)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: handoffkeep:ci
          cache-from: type=registry,ref=${{ env.IMAGE_CACHE }}
          # Only main pushes write the cache; every other run reads it. An
          # empty value disables cache-to, so PR-style runs never add a copy.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref={0},mode=max', env.IMAGE_CACHE) || '' }}
      - name: Verify vcs stamp matches the built commit
        run: ./scripts/verify-image-vcs.sh handoffkeep:ci ${{ github.sha }}
      - name: Smoke test image
        run: |
          set -eu
          user=$(docker image inspect handoffkeep:ci --format '{{.Config.User}}')
          [ "$user" = "nonroot" ] || [ "$user" = "65532" ] || {
            echo "image runs as unexpected user: '$user'" >&2; exit 1; }
          help_out=$(timeout 60 docker run --rm handoffkeep:ci serve -h 2>&1 || true)
          echo "$help_out"
          echo "$help_out" | grep -q 'Usage of serve'
          serve_out=$(timeout 60 docker run --rm handoffkeep:ci serve 2>&1 || true)
          echo "$serve_out"
          echo "$serve_out" | grep -q 'HANDOFFKEEP_DB_URL and HANDOFFKEEP_AUTH_FILE are required'
      - name: Build and push multi-arch image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=registry,ref=${{ env.IMAGE_CACHE }}
