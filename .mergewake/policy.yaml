version: 1
enabled: true
required_checks:
  - 'test'
  - 'pr: store + postgres'
  - 'vitest'
  - 'build (linux, amd64)'
  - 'build (linux, arm64)'
  - 'build (darwin, amd64)'
  - 'build (darwin, arm64)'
# Main CI health, read by mergewake watch for revert. ci-ok aggregates the
# PR-tier and post-* jobs (ci.yml); image builds and pushes on main only.
watch_checks:
  - 'ci-ok'
  - 'image'
# Bisect over cancelled main heads (fleet policy policy/fleet-ci-main-cancel):
# watch dispatches ci-any-ref.yml with {"ref": <sha>} and reads the ci-ok
# status it posts on that commit. image builds only on main pushes, so the
# any-ref verdict uses ci-ok alone; a failure only in image is held, not
# bisected (mergewake #177, hk 3259).
any_ref_workflow: ci-any-ref.yml
any_ref_checks:
  - 'ci-ok'
blocking:
  - paths: ['deploy/**', 'Dockerfile', 'scripts/**']
    reason: Deployment, service units and SQL installation can alter persistent state before a revert.
  - paths: ['internal/store/store.go', 'internal/store/*migration*.go']
    reason: Schema migration logic can rewrite stored data before a revert.
  - paths: ['internal/api/api.go', 'internal/api/wrk.go', 'internal/api/wrk_legacy.go', 'internal/cfaccess/**', 'internal/remote/**', 'internal/guard/**', 'internal/linear/client.go', 'internal/ui/hub.go']
    reason: API authentication and token forwarding can grant unauthorized access before a revert.
  - paths: ['internal/ui/reap.go', 'internal/attachments/**']
    reason: Reaping and attachment deletion can remove stored evidence before a revert.
  - paths: ['.github/workflows/**']
    reason: Workflow changes can execute privileged automation before a revert.
  - paths: ['.mergewake/**']
    reason: Policy changes can authorize irreversible automation before a revert.
review_gate:
  land: graded
fast_lane:
  max_changed_lines: 50

deploy_approval:
  - paths: ['internal/store/*migration*.go', 'internal/store/migration.go', 'internal/store/store.go', 'deploy/**', 'internal/guard/**', 'internal/cfaccess/**', 'internal/api/api.go', 'internal/api/wrk*.go']
    reason: Production schema, installation or access authority changes
